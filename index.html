const HD={nama:'name','nama siswa':'name','nama lengkap':'name',name:'name',username:'u',user:'u','user name':'u',nis:'u',nisn:'u',password:'p',sandi:'p','kata sandi':'p',pass:'p',kelas:'kelas',rombel:'kelas',class:'kelas'};
const PWC='abcdefghjkmnpqrstuvwxyz23456789';
const randPw=()=>{const a=new Uint32Array(6);crypto.getRandomValues(a);return[...a].map(x=>PWC[x%PWC.length]).join('')};
function siSplit(s){s=String(s||'').replace(/^﻿/,'');const L=s.split(/\r?\n/).filter(x=>x.trim());if(!L.length)return[];
 const f=L[0],d=f.includes('\t')?'\t':f.includes(';')?';':',';

function siRows(a,dk){a=a.map(r=>r.map(c=>String(c==null?'':c).trim())).filter(r=>r.some(Boolean));if(!a.length)return[];
 let map=['name','u','p','kelas'];const h=a[0].map(c=>HD[c.toLowerCase().replace(/[._]+/g,' ').replace(/\s+/g,' ').trim()]);
 if(h.includes('name')){map=h;a=a.slice(1)}

 return a.map(r=>{const o={};r.forEach((c,j)=>{const k=map[j];if(k&&!(k in o))o[k]=c});if(!o.kelas&&dk&&!hasK)o.kelas=dk;if(!o.p)o.gp=randPw();return o})}

async function siFile(inp){const f=inp.files[0];inp.value='';if(!f)return;

  else{await loadX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const names=wb.SheetNames,multi=names.length>1;
   names.forEach(n=>{const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});const dk=multi&&!/^(sheet|lembar)\s*\d*$/i.test(n)?n:'';rows=rows.concat(siRows(a,dk))})}

function siPlan(){if(!SI)return[];const ex=new Map(AD.users.map(u=>[u.u,u])),byName=new Map(AD.users.map(u=>[u.name.toLowerCase(),u])),seen=new Set();
 const kd=($('#ik')&&$('#ik').value.trim())||'';
 const out=SI.rows.map(r=>({name:r.name||'',u:(r.u||'').replace(/\s+/g,''),p:r.p||'',gp:r.gp,kelas:r.kelas||kd}));
 const explicit=new Set(out.map(r=>r.u).filter(Boolean));
 out.forEach(r=>{r.err='';
  if(!r.u){if(!r.name){r.err='Nama kosong';return}
   const sm=byName.get(r.name.toLowerCase());
   if(sm&&!seen.has(sm.u)){r.u=sm.u;r.auto=1}
   else{const base=(r.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).join('').replace(/[^a-z0-9]/g,'')||'siswa').slice(0,16);
    let u=base,n=2;while(ex.has(u)||explicit.has(u)||seen.has(u))u=base+n++;r.u=u;r.auto=1}}
  if(seen.has(r.u)){r.err='Username ganda dalam daftar';return}
  seen.add(r.u);r.ex=ex.has(r.u);
  if(!r.ex&&!r.name){r.err='Nama kosong';return}
  if(!r.ex&&!r.p){if(r.auto){r.p=r.gp;r.gen=1}else{r.p=r.u;r.gen=2}}
  if(r.ex&&!r.kelas)r.kelas=undefined});
 return out}

function q2t(q,n){const k=q.key,o=q.opts,flat=x=>String(x).replace(/\s*\n\s*/g,' ');let s=n+'. '+String(q.text).replace(/\r/g,'')+'\n'+'Tipe: '+q.type+'\n';

 else if(q.type==='bs')s+=o.map((x,j)=>L[j]+'. '+flat(x)+'\n').join('')+'Kunci: '+k.map(v=>v?'B':'S').join(',')+'\n';
 else if(q.type==='isian'){if(o&&!Array.isArray(o)&&o.tol)s+='Toleransi: '+o.tol+'\n';s+='Kunci: '+k.map(flat).join(' | ')+'\n'}
 else if(q.type==='jodoh'){s+=o.l.map((x,i)=>L[i]+'. '+flat(x)+' => '+flat(o.r[k[i]])+'\n').join('');const d=o.r.filter((_,j)=>!k.includes(j));if(d.length)s+='Pengecoh: '+d.map(flat).join(' | ')+'\n'}
 else if(q.type==='uraian'){if(k&&k.ref)s+='Kunci: '+flat(k.ref)+'\n'}
 if(q.exp)s+='Pembahasan: '+String(q.exp).replace(/\r/g,'')+'\n';return s.trimEnd()}

function imgComp(f,M0,lim0){return new Promise((ok,no)=>{
 if(!/^image\//.test(f.type))return no(new Error('File harus berupa gambar (JPG atau PNG).'));
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{URL.revokeObjectURL(u);const M=M0||900,LIM=lim0||300000,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>LIM&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}
  d.length>LIM*1.3?no(new Error('Gambar terlalu besar setelah dikompres. Gunakan gambar yang lebih kecil.')):ok(d)};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Gambar tidak bisa dibaca. Gunakan JPG atau PNG.'))};

function parseQ(txt){const raw=[];let q=null,f=null;
for(const rw of txt.replace(/\r/g,'').split('\n')){const l=rw.trim();if(!l)continue;let m;
 if((m=l.match(/^(\d+)\s*[.)]\s+(.*)$/))&&(!q||+m[1]===q.n+1||q.k!==null)){q={n:+m[1],text:m[2],o:{},k:null,exp:'',ty:'',pc:'',w:1,tol:0};raw.push(q);f='text';continue}
 if(!q)continue;
 if(m=l.match(/^tipe\s*[:=]\s*(.*)$/i)){q.ty=m[1].trim().toLowerCase();f=null;continue}
 if(m=l.match(/^(?:kunci(?:\s+jawaban)?|jawaban)\s*[:=]\s*(.*)$/i)){q.k=m[1].trim();f='k';continue}
 if(m=l.match(/^(?:pembahasan|penjelasan)\s*[:=]\s*(.*)$/i)){q.exp=m[1];f='exp';continue}
 if(m=l.match(/^bobot\s*[:=]\s*([\d.,]+)\s*$/i)){q.w=Math.min(100,Math.max(0.1,parseFloat(m[1].replace(',','.'))||1));f=null;continue}
 if(m=l.match(/^toleransi\s*[:=]\s*([\d.,]+)\s*$/i)){q.tol=parseFloat(m[1].replace(',','.'))||0;f=null;continue}
 if(m=l.match(/^pengecoh\s*[:=]\s*(.*)$/i)){q.pc=m[1];f=null;continue}
 if((m=l.match(/^\(?([A-Ha-h])[.)]\s*(.*)$/))&&!(m[1].toUpperCase() in q.o)){q.o[m[1].toUpperCase()]=m[2];f=m[1].toUpperCase();continue}
 if(f==='text')q.text+='\n'+l;else if(f==='exp')q.exp+='\n'+l;else if(f==='k')q.k+=' '+l;else if(f)q.o[f]+='\n'+l}
const AL={pg:'pg','pilihan ganda':'pg',pgk:'pgk',kompleks:'pgk',bs:'bs','benar-salah':'bs',benarsalah:'bs','benar/salah':'bs',isian:'isian',jodoh:'jodoh',menjodohkan:'jodoh',uraian:'uraian',esai:'uraian'};
return raw.map(q=>{const ks=Object.keys(q.o).sort(),oa=ks.map(k=>q.o[k].trim()),n=oa.length,ok=ks.every((k,i)=>k===L[i]),kl=(q.k||'').split(/[\s,;]+/).filter(Boolean);
 let t=q.ty?(AL[q.ty]||q.ty):(kl.length>1&&kl.every(x=>/^[A-Ha-h]$/.test(x))?'pgk':(n?'pg':'isian'));
 const fail=e=>({n:q.n,type:TY[t]?t:'pg',text:q.text.trim(),opts:[],key:null,exp:'',err:e}),base={n:q.n,type:t,text:q.text.trim(),exp:q.exp.trim(),w:q.w||1,err:''};
 if(!base.text)return fail('teks soal kosong');
 if(t==='pg'||t==='pgk'){if(n<2||!ok||oa.some(x=>!x))return fail('pilihan harus berurutan mulai dari A (minimal 2)');
  const ki=kl.map(x=>L.indexOf(x.toUpperCase()));if(!kl.length||ki.some(j=>j<0||j>=n))return fail('kunci jawaban tidak ditemukan atau tidak valid');
  if(t==='pg'&&ki.length!==1)return fail('pilihan ganda hanya boleh 1 kunci (untuk lebih dari satu, tambahkan baris "Tipe: pgk")');
  return{...base,opts:oa,key:t==='pg'?ki[0]:[...new Set(ki)].sort((a,b)=>a-b)}}
 if(t==='bs'){if(!n||!ok||oa.some(x=>!x))return fail('pernyataan harus ditulis A, B, C, ... berurutan');
  const bk=kl.map(x=>/^(b|benar|t|true)$/i.test(x)?true:/^(s|salah|f|false)$/i.test(x)?false:null);
  if(bk.length!==n||bk.includes(null))return fail('Kunci harus berisi '+n+' huruf B/S, mis. B,S,B');
  return{...base,opts:oa,key:bk}}
 if(t==='isian'){const key=(q.k||'').split('|').map(x=>x.trim()).filter(Boolean);if(!key.length)return fail('kunci jawaban isian tidak ditemukan');return{...base,opts:q.tol>0?{tol:q.tol}:[],key}}
 if(t==='uraian')return{...base,opts:[],key:{ref:(q.k||'').trim()}};
 if(t==='jodoh'){const Pr=oa.map(x=>x.split('=>').map(y=>y.trim()));if(n<2||!ok||Pr.some(p=>p.length!==2||!p[0]||!p[1]))return fail('format pasangan: "A. kiri => kanan" (minimal 2 pasangan)');
  const d=(q.pc||'').split('|').map(x=>x.trim()).filter(Boolean),it=shuf([...Pr.map((p,i)=>({t:p[1],i})),...d.map(x=>({t:x,i:-1}))]);
  return{...base,opts:{l:Pr.map(p=>p[0]),r:it.map(x=>x.t)},key:Pr.map((_,i)=>it.findIndex(x=>x.i===i))}}
 return fail('jenis soal "'+q.ty+'" tidak dikenal')})}

const TPL=String.raw`PANDUAN FORMAT IMPOR SOAL - EXAMDAS
(Semua baris sebelum soal nomor 1 diabaikan, jadi panduan ini boleh dibiarkan.)

ATURAN UMUM
- Setiap soal diawali nomor urut lalu titik, mis. "1. " lalu "2. " dan seterusnya.
- Pilihan ditulis A. B. C. dst. (huruf besar lalu titik), minimal 2 pilihan.
- Kunci ditulis pada baris "Kunci: ..." (boleh juga "Jawaban: ...").
- Pembahasan ditulis pada baris "Pembahasan: ..." (boleh dikosongkan).
- Teks soal, pilihan, dan pembahasan boleh lebih dari satu baris.
- Rumus ditulis dengan LaTeX di antara tanda dolar: $x^2$ (sebaris) atau $$\frac{a}{b}$$ (blok).
- Soal bersumber teks atau data: tulis teks sumber, lalu satu baris berisi ###, lalu pertanyaannya.
- Jenis soal ditulis pada baris "Tipe:" dengan pilihan: pg, pgk, bs, isian, jodoh, uraian.
  Tanpa baris Tipe, soal dianggap pilihan ganda (atau pgk jika kuncinya lebih dari satu huruf).
- Beri satu baris kosong antar soal agar rapi (tidak wajib).

CONTOH SEMUA JENIS SOAL (hapus atau ganti dengan soal Anda)

1. Ibu kota Indonesia adalah ...
A. Surabaya
B. Jakarta
C. Bandung
D. Medan
E. Makassar
Kunci: B
Pembahasan: Jakarta adalah ibu kota negara Indonesia.

2. Pilihlah semua pernyataan yang benar tentang bilangan prima.
Tipe: pgk
A. 2 adalah bilangan prima
B. 9 adalah bilangan prima
C. 7 adalah bilangan prima
D. 1 adalah bilangan prima
Kunci: A,C
Pembahasan: 9 habis dibagi 3 dan 1 bukan bilangan prima.

3. Tentukan Benar (B) atau Salah (S) untuk setiap pernyataan berikut.
Tipe: bs
A. Air murni mendidih pada suhu 100 derajat Celsius pada tekanan 1 atm.
B. Bumi adalah planet terbesar di tata surya.
C. Matahari terbit di arah timur.
Kunci: B,S,B
Pembahasan: Planet terbesar di tata surya adalah Jupiter.

4. Hasil dari $2 + 3 \times 4$ adalah ...
Tipe: isian
Kunci: 14
Pembahasan: Perkalian dikerjakan lebih dulu, sehingga $2 + 12 = 14$.

5. Jodohkan setiap negara dengan ibu kotanya.
Tipe: jodoh
A. Jepang => Tokyo
B. Prancis => Paris
C. Mesir => Kairo
Pengecoh: Roma | Madrid
Pembahasan: Pengecoh adalah pilihan kanan yang tidak punya pasangan.

6. Perhatikan data berikut.
Sebuah mobil menempuh jarak $120$ km dalam waktu $2$ jam.
###
Kecepatan rata-rata mobil tersebut adalah ...
A. 40 km/jam
B. 50 km/jam
C. 60 km/jam
D. 70 km/jam
E. 80 km/jam
Kunci: C
Pembahasan: $v=\frac{s}{t}=\frac{120}{2}=60$ km/jam.

CATATAN JENIS SOAL
- pgk (pilihan ganda kompleks): Kunci berisi lebih dari satu huruf, dipisah koma, mis. Kunci: A,C
- bs (benar/salah): tiap pilihan adalah satu pernyataan; Kunci berisi B atau S sesuai urutan, mis. Kunci: B,S,B

- jodoh (menjodohkan): tulis tiap pasangan sebagai "A. kiri => kanan". Pengecoh (opsional) dipisah tanda |.
- uraian: dinilai manual oleh guru. Baris "Kunci:" (opsional) berisi pedoman penilaian, mis. Kunci: langkah 1 benar, hasil akhir 12.
- Bobot: baris "Bobot: 2" (opsional, untuk jenis apa pun) membuat soal bernilai dua kali soal berbobot 1. Tanpa baris Bobot, bobotnya 1.
- Toleransi: baris "Toleransi: 0.01" (opsional, hanya isian angka) menerima jawaban yang selisihnya tidak lebih dari nilai itu. Jawaban angka 1/2, 0,5, dan 0.50 otomatis dianggap sama.`;

async function submit(){if(PVM)return pvExit();if(sending)return;sending=true;try{const pid=ST.pkg.id;await rpc('submit',{t:S.token,a:att().ans,f:att().flags});dirty=false;try{localStorage.removeItem(bkK())}catch(e){}await load();closeM();if(document.fullscreenElement)document.exitFullscreen();ix=0;try{RES=normRes(await rpc('student_result',{t:S.token,pid}),pid);CF=mkCF()}catch(e2){}render()}catch(e){if(Date.now()-subErr>20000){subErr=Date.now();toast(e.message+(/internet/i.test(e.message)?' Jawaban Anda aman tersimpan di HP. Tekan Kumpulkan lagi setelah koneksi kembali; bila waktu habis, sistem mengirim jawaban secara otomatis.':''))}}sending=false}
function resV(a,R){const P=R.pcfg,sR=P.showResult;let h=`<div data-vt class="max-w-2xl mx-auto p-4"><button class="${G} mb-2" onclick="backHome()">&lsaquo; Daftar ujian</button><div class="bg-white rounded-xl border p-6 text-center"><div class="text-xs text-slate-400">${esc(R.pkg.name)}</div><h2 class="font-bold text-lg mb-1">Ujian selesai</h2>`;
h+=a.pending>0?`<p class="my-3 text-slate-600">Jawaban Anda sudah tersimpan. Nilai akhir akan muncul setelah guru menilai soal uraian (${a.pending} soal).</p>`:sR?`<div class="text-6xl font-bold text-brand-600 my-3" data-count="${esc(a.score)}">${a.score}</div><p class="text-sm text-slate-600">Benar ${a.correct} dari ${a.total} soal</p>`:'<p class="my-3 text-slate-600">Jawaban Anda sudah tersimpan. Nilai akan diumumkan oleh guru.</p>';
if(a.reason!=='Dikumpulkan siswa')h+=`<p class="text-sm text-amber-700 mt-2">Status: ${esc(a.reason)}</p>`;h+='</div>';
if(sR&&P.showExp&&!a.pending)h+=a.qs.map((q,i)=>{const m=a.ans[q.id],ur=q.type==='uraian',pt=a.manual?a.manual[q.id]:null,ok=!ur&&(pt!=null?pt>=100:isOk(q,m));
 return`<div class="bg-white rounded-xl border p-4 mt-3"><div class="mb-2"><b>${i+1}.</b> ${qTxt(q.text)}</div>${qImg(q)}<div class="mb-2">${itemsHtml(q)}</div><div class="text-sm">Jawaban Anda: <b class="${ur?'':ok?'text-emerald-700':'text-red-600'}">${ansHtml(q,m)}</b></div>${ur?`<div class="text-sm">Nilai: <b>${pt!=null?pt+'/100':'-'}</b></div>${q.key&&q.key.ref?`<div class="text-sm">Pedoman: ${fmt(q.key.ref)}</div>`:''}`:ok?'':`<div class="text-sm">Kunci: <b class="text-emerald-700">${keyHtml(q)}</b></div>`}${q.exp?`<div class="text-sm mt-2 text-slate-600">Pembahasan: ${fmt(q.exp)}</div>`:''}</div>`}).join('');
return h+'</div>'}

/* ---------- ANTI-KECURANGAN (dicatat & dihitung oleh server) ---------- */
async function warn(why){if(PVM||!live())return;const n=Date.now();if(n-lw<1500)return;lw=n;let r;
  try{r=await rpc('violation',{t:S.token,why})}catch(e){att().warns++;r={warns:att().warns,done:att().warns>=CF.maxWarn}}
  if(r.done){await load().catch(()=>{});closeM();if(document.fullscreenElement)document.exitFullscreen();render();return}
  att().warns=r.warns;render();
  modal(`<h3 class="font-bold text-red-600 mb-2">Peringatan pelanggaran</h3><p class="mb-2">${esc(why)}.</p><p class="mb-4 text-sm">Pelanggaran ${r.warns} dari ${CF.maxWarn}. Pada pelanggaran ke-${CF.maxWarn}, ujian otomatis dikumpulkan.</p><button class="${P}" onclick="closeM();FS()&&!document.fullscreenElement&&document.documentElement.requestFullscreen().catch(()=>{})">Saya mengerti, lanjutkan</button>`)}
const graceMs=()=>{const g=CF.grace;return Math.max(0,(g===undefined||g===null||g===''?3:(+g||0)))*1000};
function away(why){if(PVM||!live()||Date.now()<pauseV||aw)return;aw={t0:Date.now(),why};aw.tm=setTimeout(()=>{if(aw){const w=aw;aw=null;warn(w.why+' (lebih dari '+Math.round(graceMs()/1000)+' detik)')}},graceMs())}
function back(){if(pauseV)setTimeout(()=>{pauseV=0},1500);if(!aw)return;clearTimeout(aw.tm);const w=aw;aw=null;const s=Date.now()-w.t0;if(s>=graceMs()&&Date.now()>=pauseV)warn(w.why+' (selama '+Math.max(1,Math.round(s/1000))+' detik)')}
document.addEventListener('visibilitychange',()=>document.hidden?away('Anda berpindah tab/aplikasi atau mengunci layar'):back());
window.addEventListener('blur',()=>away('Jendela ujian kehilangan fokus'));
window.addEventListener('focus',back);
document.addEventListener('fullscreenchange',()=>{if(live()&&FS()){if(!document.fullscreenElement){if(Date.now()>=pauseV)warn('Anda keluar dari mode layar penuh')}else render()}});
['contextmenu','copy','cut','paste','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(live()&&!(t==='selectstart'&&['INPUT','TEXTAREA'].includes(e.target.tagName)))e.preventDefault()}));
document.addEventListener('keydown',e=>{if(!live())return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
if(e.key==='F12'||e.key==='PrintScreen'||(m&&['c','v','x','a','u','s','p'].includes(k))||(m&&e.shiftKey&&['i','j','c'].includes(k)))e.preventDefault()});
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen'&&live()){try{navigator.clipboard.writeText('')}catch(_){}toast('Tangkapan layar tidak diizinkan saat ujian.')}});
window.addEventListener('beforeunload',e=>{if(live()&&!PVM){e.preventDefault();e.returnValue=''}});
setInterval(()=>{if(!live())return;const s=rem();
 document.querySelectorAll('.tmx').forEach(el=>{el.textContent=tmTxt(s);el.className='tmx font-mono font-bold '+(s<60?'text-red-600':'text-brand-700')})
 if(s<=0)submit()},1000);
setInterval(()=>{const e=xp&&ST&&ST.list?ST.list.find(x=>x.id===xp):null;if(S&&S.role==='siswa'&&e&&!att()&&e.open&&$('#app').querySelector('[data-nopen]')&&Date.now()+off>=new Date(e.open).getTime())render()},1000);
setInterval(async()=>{if(!S||S.role!=='siswa'||!ST||starting)return;
 try{const r=await rpc('student_ping',{t:S.token}),a=att();off=r.now-Date.now();
  if(a&&!a.done){if(!r.live){await load();closeM();render()}else{if(r.end!==a.end)a.end=r.end;if(r.warns>a.warns)a.warns=r.warns}}
  else if(r.live&&!starting){RES=null;await load();render()}
 }catch(e){}},15000);
setInterval(()=>{if(staff()&&tab==='rekap'&&!$('#modal').innerHTML&&document.activeElement?.tagName!=='SELECT')refresh()},5000);
(async()=>{if(SUPABASE_URL.startsWith('GANTI')){$('#app').innerHTML='<div class="p-6 max-w-md mx-auto">Isi <b>SUPABASE_URL</b> dan <b>SUPABASE_KEY</b> di bagian atas file ini terlebih dahulu.</div>';return}
 try{CF=await rpc('get_cfg')}catch(e){}
 try{await load()}catch(e){$('#app').innerHTML='<div class="p-6 max-w-md mx-auto text-red-600">Tidak dapat terhubung ke server. Periksa koneksi internet.</div>';return}
 render();if(live()&&rem()<=0)submit()})();
</script></body></html>
