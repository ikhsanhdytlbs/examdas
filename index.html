<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Ujian Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f1f5f4;color:#0f172a}.noselect,.noselect *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.noselect input{user-select:text;-webkit-user-select:text}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0f766e;outline-offset:2px}</style>
</head><body>
<div id="app"></div><div id="modal"></div>
<script>
/* ====== ISI DUA BARIS INI (Supabase > Project Settings > API) ====== */
const SUPABASE_URL='https://ucebilmfuracnvneuwfn.supabase.co';
const SUPABASE_KEY='sb_publishable_47H9vxFDBweX5mXXjMTL3Q_kHLcQT6W';
/* =================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\n/g,'<br>');
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));
const I='w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white',
P='px-4 py-2 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800',
Gr='px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700',
G='px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-sm hover:bg-slate-50';
async function rpc(fn,a={}){
  const h={apikey:SUPABASE_KEY,'Content-Type':'application/json'};if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(a)});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||'Gagal terhubung ke server');return j}
let S=LS('cbt_sess'),CF={title:'Ujian Online',duration:60,maxWarn:3},ST=null,AD=null,tab='rekap',sp=null,lr='siswa',ix=0,off=0,sending=false,lw=0,sv;
const att=()=>ST&&ST.att, live=()=>S&&S.role==='siswa'&&att()&&!att().done;
const FS=()=>CF.fs&&!!document.documentElement.requestFullscreen; // iPhone Safari tidak mendukung: otomatis dilewati
const toLocal=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
async function load(){if(!S)return;try{
  if(S.role==='admin'){AD=await rpc('admin_data',{t:S.token});CF=AD.cfg;off=AD.now-Date.now();if(!AD.pkgs.some(p=>p.id===sp))sp=CF.pkg}
  else{ST=await rpc('student_state',{t:S.token});CF=ST.cfg;off=ST.now-Date.now()}
}catch(e){if(/unauthorized/.test(e.message)){S=null;LS('cbt_sess',null);ST=AD=null}else throw e}}
async function refresh(){try{await load()}catch(e){toast(e.message)}render()}
function toast(m){alert(m)}
function math(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false})}
function modal(h){$('#modal').innerHTML=`<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3"><div class="bg-white rounded-xl p-5 w-full max-w-2xl max-h-[90vh] overflow-auto">${h}</div></div>`;math($('#modal'))}
const closeM=()=>$('#modal').innerHTML='';
function ask(msg,cb,ok='Ya'){window._cb=cb;modal(`<p class="mb-4">${msg}</p><div class="flex justify-end gap-2"><button class="${G}" onclick="closeM()">Batal</button><button class="${P}" onclick="closeM();_cb()">${ok}</button></div>`)}
const act=async(fn,a)=>{try{await rpc(fn,{t:S.token,...a});await load();render()}catch(e){toast(e.message)}};

function render(){const a=$('#app');a.innerHTML=!S?loginV():S.role==='admin'?(AD?adminV():'<p class="p-6">Memuat...</p>'):(ST?studentV():'<p class="p-6">Memuat...</p>');
  document.body.classList.toggle('noselect',!!live());math(a)}
function loginV(){return`<div class="min-h-screen flex items-center justify-center p-4 bg-teal-800"><div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
<h1 class="text-2xl font-bold text-center">${esc(CF.title)}</h1><p class="text-center text-slate-500 text-sm mb-4">Computer-Based Test</p>
<div class="flex bg-slate-100 rounded-lg p-1 mb-4">${['siswa','admin'].map(r=>`<button onclick="lr='${r}';render()" class="flex-1 py-1.5 rounded-md text-sm font-medium ${lr===r?'bg-white shadow text-teal-700':'text-slate-500'}">Masuk ${r==='admin'?'Admin':'Siswa'}</button>`).join('')}</div>
<input id="lu" placeholder="Username" class="${I}" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="Password" class="${I} mt-3" onkeydown="event.key==='Enter'&&login()">
<p id="le" class="text-red-600 text-sm mt-2 min-h-5"></p><button onclick="login()" class="${P} w-full mt-2">Masuk</button></div></div>`}
async function login(){try{const r=await rpc('login',{u:$('#lu').value.trim(),p:$('#lp').value});
  if((lr==='admin')!==(r.role==='admin'))throw new Error('Akun ini bukan akun '+(lr==='admin'?'admin':'siswa')+'.');
  S={token:r.token,role:r.role,name:r.name,u:r.u};LS('cbt_sess',S);ix=0;await load();render()}
 catch(e){$('#le').textContent=e.message==='invalid'?'Username atau password salah.':e.message}}
function logout(){if(live())return;S=null;ST=AD=null;LS('cbt_sess',null);render()}
const hdr=()=>`<header class="bg-gradient-to-r from-teal-900 to-teal-700 text-white"><div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0">${LOGO}<div class="min-w-0"><div class="font-bold leading-tight truncate">${esc(CF.title)}</div><div class="text-xs text-teal-100">Computer-Based Test</div></div></div><div class="flex items-center gap-3 text-sm min-w-0"><span class="hidden sm:inline truncate max-w-48">${esc(S.name)}</span><button class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25" onclick="logout()">Keluar</button></div></div></header>`;

/* ---------- JENIS SOAL ---------- */
const L='ABCDEFGH',TY={pg:'Pilihan ganda',pgk:'Pilihan ganda kompleks',bs:'Benar / Salah',isian:'Isian singkat',jodoh:'Menjodohkan'};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nrm=s=>String(s??'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.');
const answered=a=>a!=null&&(Array.isArray(a)?a.some(x=>x!=null):a!=='');
const bsT=v=>v==null?'-':v?'B':'S';
function isOk(q,a){const k=q.key;if(!answered(a))return false;
 if(q.type==='pg')return a===k;
 if(q.type==='pgk')return Array.isArray(a)&&a.length===k.length&&k.every(x=>a.includes(x));
 if(q.type==='isian')return k.some(x=>nrm(x)===nrm(a));
 return Array.isArray(a)&&k.every((x,i)=>a[i]===x)}
function keyHtml(q){const k=q.key,o=q.opts;
 if(q.type==='pg')return`${L[k]}. ${fmt(o[k])}`;
 if(q.type==='pgk')return k.map(j=>L[j]).join(', ');
 if(q.type==='bs')return k.map((v,j)=>`${j+1}:${bsT(v)}`).join(' · ');
 if(q.type==='isian')return k.map(fmt).join(' | ');
 return k.map((v,i)=>`${i+1}→${L[v]}`).join(' · ')}
function ansHtml(q,a){if(!answered(a))return'(kosong)';
 if(q.type==='pg')return`${L[a]}. ${fmt(q.opts[a])}`;
 if(q.type==='pgk')return a.map(j=>L[j]).join(', ');
 if(q.type==='bs')return a.map((v,j)=>`${j+1}:${bsT(v)}`).join(' · ');
 if(q.type==='isian')return fmt(a);
 return a.map((v,i)=>`${i+1}→${v==null?'-':L[v]}`).join(' · ')}
function itemsHtml(q){
 if(q.type==='pg'||q.type==='pgk')return q.opts.map((o,j)=>`<div class="text-sm">${L[j]}. ${fmt(o)}</div>`).join('');
 if(q.type==='bs')return q.opts.map((o,j)=>`<div class="text-sm">${j+1}. ${fmt(o)}</div>`).join('');
 if(q.type==='jodoh')return`<div class="grid grid-cols-2 gap-2 text-sm"><div>${q.opts.l.map((o,i)=>`<div>${i+1}. ${fmt(o)}</div>`).join('')}</div><div>${q.opts.r.map((o,j)=>`<div>${L[j]}. ${fmt(o)}</div>`).join('')}</div></div>`;
 return''}
function qBody(q){const k=q.key,o=q.opts;
 if(q.type==='pg'||q.type==='pgk')return o.map((x,j)=>`<div class="${(q.type==='pg'?j===k:k.includes(j))?'text-emerald-700 font-semibold':''}">${L[j]}. ${fmt(x)}</div>`).join('');
 if(q.type==='bs')return o.map((x,j)=>`<div>${j+1}. ${fmt(x)} <b class="${k[j]?'text-emerald-700':'text-red-600'}">[${k[j]?'Benar':'Salah'}]</b></div>`).join('');
 if(q.type==='isian')return`<div class="text-emerald-700 font-semibold">Jawaban: ${k.map(fmt).join(' | ')}</div>`;
 return o.l.map((x,i)=>`<div>${i+1}. ${fmt(x)} <span class="text-emerald-700 font-semibold">&rarr; ${fmt(o.r[k[i]])}</span></div>`).join('')+(o.r.length>o.l.length?'<div class="text-slate-400">+ pilihan pengecoh</div>':'')}
function qInput(q,a){const t=q.type;
 if(t==='pg')return q.opts.map((o,j)=>{const on=a===j;return`<button onclick="pick(${j})" class="w-full text-left rounded-lg border px-4 py-3 mb-2 flex items-start gap-3 transition ${on?'border-teal-600 bg-teal-50 ring-1 ring-teal-600':'border-slate-300 hover:bg-slate-50'}"><span class="mt-0.5 w-5 h-5 shrink-0 rounded-full border-2 flex items-center justify-center ${on?'border-teal-700':'border-slate-400'}">${on?'<span class="w-2.5 h-2.5 rounded-full bg-teal-700"></span>':''}</span><span><b class="mr-1">${L[j]}.</b>${fmt(o)}</span></button>`}).join('');
 if(t==='pgk')return`<p class="text-xs text-slate-500 mb-2">Pilih semua jawaban yang benar.</p>`+q.opts.map((o,j)=>{const on=(a||[]).includes(j);return`<button onclick="tog(${j})" class="w-full text-left rounded-lg border px-4 py-3 mb-2 flex items-start gap-3 transition ${on?'border-teal-600 bg-teal-50 ring-1 ring-teal-600':'border-slate-300 hover:bg-slate-50'}"><span class="mt-0.5 w-5 h-5 shrink-0 rounded border-2 flex items-center justify-center text-white text-xs ${on?'border-teal-700 bg-teal-700':'border-slate-400'}">${on?'&#10003;':''}</span><span><b class="mr-1">${L[j]}.</b>${fmt(o)}</span></button>`}).join('');
 if(t==='bs')return`<p class="text-xs text-slate-500 mb-2">Tentukan setiap pernyataan Benar atau Salah.</p>`+q.opts.map((o,j)=>{const v=(a||[])[j];return`<div class="border rounded-lg p-3 mb-2"><div class="mb-2">${fmt(o)}</div><div class="flex gap-2">${[[true,'Benar'],[false,'Salah']].map(([b,l])=>`<button onclick="setBs(${j},${b})" class="${G} flex-1 ${v===b?'!bg-teal-700 !text-white':''}">${l}</button>`).join('')}</div></div>`}).join('');
 if(t==='isian')return`<input id="ti" class="${I} text-base" value="${esc(a||'')}" placeholder="Ketik jawaban Anda" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" oninput="setTxt(this.value)" onchange="render()">`;
 return`<p class="text-xs text-slate-500 mb-2">Pasangkan setiap pernyataan di kiri dengan pilihan yang tepat di kanan.</p><div class="border rounded-lg p-3 mb-3 bg-slate-50 text-sm">${q.opts.r.map((x,j)=>`<div><b>${L[j]}.</b> ${fmt(x)}</div>`).join('')}</div>`+q.opts.l.map((x,i)=>`<div class="border rounded-lg p-3 mb-2 flex items-center justify-between gap-3"><div>${i+1}. ${fmt(x)}</div><select class="border border-slate-300 rounded-lg px-2 py-1 text-base bg-white" onchange="setJ(${i},this.value)"><option value="">-</option>${q.opts.r.map((_,j)=>`<option value="${j}" ${(a||[])[i]===j?'selected':''}>${L[j]}</option>`).join('')}</select></div>`).join('')}

/* ---------- TAMPILAN UJIAN ---------- */
const LOGO='<div class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center shrink-0"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/></svg></div>';
let fz=+(localStorage.getItem('cbt_fz')||1);
const setFz=i=>{fz=i;try{localStorage.setItem('cbt_fz',i)}catch(e){}render()};
const fzC=()=>['text-base','text-lg','text-xl'][fz]||'text-lg';
const sp3=t=>{const p=String(t).split(/\n\s*###\s*\n/);return p.length>1?[p[0],p.slice(1).join('\n')]:['',t]};
const qTxt=t=>{const [a,b]=sp3(t);return a?`<div class="mb-2 pb-2 border-b border-dashed border-slate-300">${fmt(a)}</div>${fmt(b)}`:fmt(t)};
const tmTxt=s=>{const p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)};
function qInfo(){const a=att(),q=cur(),n=a.qs.length,dn=a.qs.filter(x=>answered(a.ans[x.id])).length,fl=a.qs.filter(x=>a.flags[x.id]).length,r=(k,v)=>`<div class="flex justify-between gap-3 border-b border-slate-100 py-1.5"><span class="text-slate-500">${k}</span><b class="text-right">${v}</b></div>`;
modal(`<h3 class="font-semibold mb-3">Informasi soal</h3><div class="text-sm">${r('Nomor soal',`${ix+1} dari ${n}`)}${r('Jenis soal',TY[q.type]||'')}${r('Status soal ini',a.flags[q.id]?'Ragu-ragu':answered(a.ans[q.id])?'Sudah dijawab':'Belum dijawab')}${r('Soal terjawab',`${dn} dari ${n}`)}${r('Soal ragu-ragu',fl)}${r('Pelanggaran',`${a.warns} dari ${CF.maxWarn}`)}</div><div class="text-right mt-4"><button class="${G}" onclick="closeM()">Tutup</button></div>`)}
function listQ(){const a=att(),lg=(c,t)=>`<span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm ${c}"></span>${t}</span>`;
modal(`<h3 class="font-semibold mb-3">Daftar soal</h3><div class="grid grid-cols-5 sm:grid-cols-8 gap-2">${a.qs.map((x,i)=>`<button onclick="closeM();ix=${i};render()" class="h-10 rounded-lg text-sm font-medium ${a.flags[x.id]?'bg-amber-400 text-slate-900':answered(a.ans[x.id])?'bg-teal-700 text-white':'bg-slate-200 text-slate-700'} ${i===ix?'ring-2 ring-offset-2 ring-teal-700':''}">${i+1}</button>`).join('')}</div>
<div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500 mt-3">${lg('bg-teal-700','Dijawab')}${lg('bg-amber-400','Ragu-ragu')}${lg('bg-slate-200','Belum dijawab')}</div>
<div class="flex justify-between gap-2 mt-4"><button class="${G}" onclick="closeM()">Tutup</button><button class="${Gr}" onclick="closeM();askSubmit()">Kumpulkan jawaban</button></div>`)}
/* ---------- ADMIN ---------- */
const pkn=id=>AD.pkgs.find(p=>p.id===id)?.name||'';
function adminV(){const T=[['rekap','Pantau & rekap'],['soal','Soal'],['paket','Paket'],['siswa','Siswa'],['set','Pengaturan']];
const sel=(tab==='rekap'||tab==='soal')?`<div class="flex items-center gap-2 mb-3 text-sm"><span>Paket:</span><select class="${I} max-w-xs" onchange="sp=+this.value;render()">${AD.pkgs.map(p=>`<option value="${p.id}" ${p.id===sp?'selected':''}>${esc(p.name)}${p.id===CF.pkg?' (AKTIF)':''}</option>`).join('')}</select></div>`:'';
return hdr()+`<div class="max-w-5xl mx-auto p-3"><div class="flex gap-2 mb-3 flex-wrap">${T.map(([k,l])=>`<button onclick="tab='${k}';render()" class="px-4 py-2 rounded-lg text-sm font-medium ${tab===k?'bg-teal-700 text-white':'bg-white border'}">${l}</button>`).join('')}</div>${sel}<div class="bg-white rounded-xl border p-4">${{soal:soalV,paket:paketV,siswa:siswaV,set:setV,rekap:rekapV}[tab]()}</div></div>`}
function paketV(){return`<div class="flex justify-between mb-1 gap-2"><h2 class="font-semibold">Paket soal</h2><button class="${P}" onclick="pkForm()">Buat paket baru</button></div><p class="text-xs text-slate-500 mb-3">Siswa mengerjakan paket yang berstatus AKTIF. Ganti paket aktif sebelum ujian dimulai, jangan saat ujian sedang berlangsung.</p>`+AD.pkgs.map(p=>`<div class="border rounded-lg p-3 mb-2 flex justify-between items-center gap-2 flex-wrap ${p.id===CF.pkg?'border-teal-600 bg-teal-50':''}"><div><b>${esc(p.name)}</b> ${p.id===CF.pkg?'<span class="text-xs bg-teal-700 text-white rounded px-2 py-0.5 ml-1">AKTIF</span>':''}<div class="text-sm text-slate-500">${p.n} soal · ${p.duration} menit</div></div><div class="flex gap-1 flex-wrap">${p.id===CF.pkg?'':`<button class="${Gr}" onclick="pkAct(${p.id})">Aktifkan</button>`}<button class="${G}" onclick="sp=${p.id};tab='soal';render()">Kelola soal</button><button class="${G}" onclick="pkForm(${p.id})">Ubah</button><button class="${G}" onclick="pkDup(${p.id})">Duplikat</button>${p.id===CF.pkg?'':`<button class="${G} text-red-600" onclick="pkDel(${p.id})">Hapus</button>`}</div></div>`).join('')}
function pkForm(id){const p=AD.pkgs.find(x=>x.id===id)||{name:'',duration:60};modal(`<h3 class="font-semibold mb-3">${id?'Ubah':'Buat'} paket</h3><label class="text-sm">Nama paket<input id="pn" class="${I}" value="${esc(p.name)}" placeholder="mis. Trigonometri - Penilaian Harian"></label><label class="text-sm block mt-3">Durasi (menit)<input id="pd" type="number" min="1" class="${I}" value="${p.duration}"></label><div class="flex justify-end gap-2 mt-4"><button class="${G}" onclick="closeM()">Batal</button><button class="${P}" onclick="pkSave(${id||'null'})">Simpan</button></div>`)}
function pkSave(id){const nm=$('#pn').value.trim();if(!nm)return toast('Nama paket wajib diisi.');const dur=Math.max(1,+$('#pd').value||60);closeM();act('admin_pkg_save',{pid:id,nm,dur}).then(()=>{if(!id){sp=Math.max(...AD.pkgs.map(p=>p.id));tab='soal';render()}})}
const pkAct=id=>ask('Jadikan paket ini AKTIF? Siswa yang memulai ujian berikutnya akan mengerjakan paket ini.',()=>act('admin_pkg_activate',{pid:id}),'Aktifkan');
const pkDup=id=>act('admin_pkg_dup',{pid:id});
const pkDel=id=>ask('Hapus paket ini beserta semua soal dan hasil ujiannya? Tindakan ini tidak bisa dibatalkan.',()=>act('admin_pkg_del',{pid:id}),'Hapus');
function soalV(){const Q=AD.qs.filter(q=>q.pkg===sp);return`<div class="flex justify-between mb-3 gap-2"><h2 class="font-semibold">Soal: ${esc(pkn(sp))} (${Q.length})</h2><div class="flex gap-2"><button onclick="impForm()" class="${G}">Impor soal</button><button onclick="qForm()" class="${P}">Tambah soal</button></div></div>`+(Q.map((q,i)=>`<div class="border rounded-lg p-3 mb-2 flex justify-between gap-2"><div class="min-w-0"><div class="mb-1"><b>${i+1}.</b> <span class="text-xs bg-slate-100 border rounded px-1.5 py-0.5">${TY[q.type]}</span></div>${qTxt(q.text)}<div class="text-sm text-slate-600 mt-1">${qBody(q)}</div></div><div class="shrink-0 flex flex-col sm:flex-row gap-1 h-fit"><button onclick="qForm(${q.id})" class="${G}">Edit</button><button onclick="qDel(${q.id})" class="${G} text-red-600">Hapus</button></div></div>`).join('')||'<p class="text-slate-500">Belum ada soal di paket ini.</p>')}
let QT='pg';
function qDyn(t,q){const o=q.opts,k=q.key;
 if(t==='pg'||t==='pgk')return`<p class="text-xs text-slate-500 mt-2">Pilihan jawaban (${t==='pg'?'pilih satu bulatan sebagai kunci':'centang semua jawaban yang benar'}). Kosongkan baris yang tidak dipakai; minimal 2 pilihan.</p>`+[0,1,2,3,4].map(j=>`<div class="flex items-center gap-2 mt-1"><input type="${t==='pg'?'radio':'checkbox'}" name="qa" class="ck" ${(t==='pg'?k===j:Array.isArray(k)&&k.includes(j))?'checked':''} onchange="pv()"><b class="w-4">${L[j]}</b><input class="o ${I}" value="${esc((o||[])[j]||'')}" oninput="pv()"></div>`).join('');

function parseQ(txt){const raw=[];let q=null,f=null;
for(const rw of txt.replace(/\r/g,'').split('\n')){const l=rw.trim();if(!l)continue;let m;
 if((m=l.match(/^(\d+)\s*[.)]\s+(.*)$/))&&(!q||+m[1]===q.n+1||q.k!==null)){q={n:+m[1],text:m[2],o:{},k:null,exp:'',ty:'',pc:''};raw.push(q);f='text';continue}
 if(!q)continue;
 if(m=l.match(/^tipe\s*[:=]\s*(.*)$/i)){q.ty=m[1].trim().toLowerCase();f=null;continue}
 if(m=l.match(/^(?:kunci(?:\s+jawaban)?|jawaban)\s*[:=]\s*(.*)$/i)){q.k=m[1].trim();f='k';continue}
 if(m=l.match(/^(?:pembahasan|penjelasan)\s*[:=]\s*(.*)$/i)){q.exp=m[1];f='exp';continue}
 if(m=l.match(/^pengecoh\s*[:=]\s*(.*)$/i)){q.pc=m[1];f=null;continue}
 if((m=l.match(/^\(?([A-Ha-h])[.)]\s*(.*)$/))&&!(m[1].toUpperCase() in q.o)){q.o[m[1].toUpperCase()]=m[2];f=m[1].toUpperCase();continue}
 if(f==='text')q.text+='\n'+l;else if(f==='exp')q.exp+='\n'+l;else if(f==='k')q.k+=' '+l;else if(f)q.o[f]+='\n'+l}
const AL={pg:'pg','pilihan ganda':'pg',pgk:'pgk',kompleks:'pgk',bs:'bs','benar-salah':'bs',benarsalah:'bs','benar/salah':'bs',isian:'isian',jodoh:'jodoh',menjodohkan:'jodoh'};
return raw.map(q=>{const ks=Object.keys(q.o).sort(),oa=ks.map(k=>q.o[k].trim()),n=oa.length,ok=ks.every((k,i)=>k===L[i]),kl=(q.k||'').split(/[\s,;]+/).filter(Boolean);
 let t=q.ty?(AL[q.ty]||q.ty):(kl.length>1&&kl.every(x=>/^[A-Ha-h]$/.test(x))?'pgk':(n?'pg':'isian'));
 const fail=e=>({n:q.n,type:TY[t]?t:'pg',text:q.text.trim(),opts:[],key:null,exp:'',err:e}),base={n:q.n,type:t,text:q.text.trim(),exp:q.exp.trim(),err:''};
 if(!base.text)return fail('teks soal kosong');
 if(t==='pg'||t==='pgk'){if(n<2||!ok||oa.some(x=>!x))return fail('pilihan harus berurutan mulai dari A (minimal 2)');
  const ki=kl.map(x=>L.indexOf(x.toUpperCase()));if(!kl.length||ki.some(j=>j<0||j>=n))return fail('kunci jawaban tidak ditemukan atau tidak valid');
  if(t==='pg'&&ki.length!==1)return fail('pilihan ganda hanya boleh 1 kunci (untuk lebih dari satu, tambahkan baris "Tipe: pgk")');
  return{...base,opts:oa,key:t==='pg'?ki[0]:[...new Set(ki)].sort((a,b)=>a-b)}}
 if(t==='bs'){if(!n||!ok||oa.some(x=>!x))return fail('pernyataan harus ditulis A, B, C, ... berurutan');
  const bk=kl.map(x=>/^(b|benar|t|true)$/i.test(x)?true:/^(s|salah|f|false)$/i.test(x)?false:null);
  if(bk.length!==n||bk.includes(null))return fail('Kunci harus berisi '+n+' huruf B/S, mis. B,S,B');
  return{...base,opts:oa,key:bk}}
 if(t==='isian'){const key=(q.k||'').split('|').map(x=>x.trim()).filter(Boolean);if(!key.length)return fail('kunci jawaban isian tidak ditemukan');return{...base,opts:[],key}}
 if(t==='jodoh'){const Pr=oa.map(x=>x.split('=>').map(y=>y.trim()));if(n<2||!ok||Pr.some(p=>p.length!==2||!p[0]||!p[1]))return fail('format pasangan: "A. kiri => kanan" (minimal 2 pasangan)');
  const d=(q.pc||'').split('|').map(x=>x.trim()).filter(Boolean),it=shuf([...Pr.map((p,i)=>({t:p[1],i})),...d.map(x=>({t:x,i:-1}))]);
  return{...base,opts:{l:Pr.map(p=>p[0]),r:it.map(x=>x.t)},key:Pr.map((_,i)=>it.findIndex(x=>x.i===i))}}
 return fail('jenis soal "'+q.ty+'" tidak dikenal')})}

<p class="text-sm mb-3">${esc(ST.pkg.name)} · ${ST.pkg.n} soal · ${ST.pkg.duration} menit · batas pelanggaran ${c.maxWarn}x</p>
<ul class="text-sm list-disc pl-5 space-y-1 mb-4 text-slate-700"><li>Jangan berpindah tab/aplikasi, jangan menarik panel notifikasi, dan jangan meminimalkan layar.</li><li>Salin, tempel, dan klik kanan dinonaktifkan.</li>${FS()?'<li>Ujian berjalan dalam layar penuh. Keluar dari layar penuh dihitung pelanggaran.</li>':''}<li>Pelanggaran mencapai ${c.maxWarn}x: ujian otomatis dikumpulkan.</li><li>Waktu terus berjalan meski halaman dimuat ulang atau ditutup.</li><li>Pastikan baterai dan koneksi internet stabil.</li></ul>
${!ST.pkg.n?'<p class="text-red-600 text-sm">Belum ada soal pada paket ini. Hubungi guru.</p>':closed?'<p class="text-red-600 text-sm">Ujian sudah ditutup.</p>':`<button class="${P}" onclick="begin()">Mulai ujian</button>`}</div></div>`}
async function begin(){if(FS())document.documentElement.requestFullscreen().catch(()=>{});try{await rpc('start_attempt',{t:S.token});ix=0;await load();render()}catch(e){toast(e.message)}}
const rem=()=>Math.max(0,Math.round((att().end-(Date.now()+off))/1000));
function examV(){const a=att(),qs=a.qs,q=qs[ix],n=qs.length,need=FS()&&!document.fullscreenElement,[stim,qq]=sp3(q.text),dn=qs.filter(x=>answered(a.ans[x.id])).length,s=rem(),last=ix===n-1,
pill='inline-flex items-center gap-1.5 rounded-full px-4 py-1.5 text-sm font-medium',bt='rounded-full px-3 sm:px-6 py-2.5 text-sm font-medium transition';
return`<div class="min-h-screen bg-slate-100">
<header class="bg-gradient-to-r from-teal-900 to-teal-700 text-white pb-16 sm:pb-20"><div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0">${LOGO}<div class="min-w-0"><div class="font-bold leading-tight truncate">${esc(CF.title)}</div><div class="text-xs text-teal-100 truncate">${esc(ST.pkg.name)}</div></div></div><div class="text-sm text-right min-w-0 max-w-[50%]"><div class="font-medium truncate">${esc(S.name)}</div><div class="text-xs text-teal-100 truncate">${esc(S.u)}</div></div></div></header>
<main class="max-w-6xl mx-auto px-3 -mt-12 sm:-mt-14 pb-8"><div class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
<div class="h-1.5 bg-slate-200"><div class="h-full bg-emerald-500 transition-all" style="width:${Math.round(dn/n*100)}%"></div></div>
<div class="px-4 sm:px-6 pt-4 pb-3 flex flex-wrap items-start justify-between gap-3 border-b border-slate-200">
<div><h2 class="text-xl sm:text-2xl font-semibold text-slate-800">Soal nomor ${ix+1}</h2><div class="flex items-center gap-1 mt-1 text-xs text-slate-500"><span class="mr-1">Ukuran font soal:</span>${[0,1,2].map(i=>`<button onclick="setFz(${i})" aria-label="Ukuran font ${i+1}" class="w-7 h-7 rounded hover:bg-slate-100 ${fz===i?'text-teal-700 font-bold bg-teal-50':'text-slate-600'}" style="font-size:${12+i*3}px">A</button>`).join('')}</div></div>
<div class="flex flex-wrap items-center gap-2"><button onclick="qInfo()" class="${pill} bg-teal-700 text-white hover:bg-teal-800">Informasi soal</button><span class="${pill} border border-slate-300 text-slate-600">Sisa waktu: <b id="tm" class="font-mono ${s<60?'text-red-600':'text-teal-800'}">${tmTxt(s)}</b></span><button onclick="listQ()" class="${pill} bg-teal-700 text-white hover:bg-teal-800">Daftar soal</button></div></div>
<div class="px-4 sm:px-6 py-2 flex flex-wrap justify-between gap-1 text-xs sm:text-sm text-slate-500"><span>${TY[q.type]||''} · terjawab ${dn}/${n}</span><span class="${a.warns?'text-amber-700 font-medium':''}">Pelanggaran ${a.warns}/${CF.maxWarn}</span></div>
<div class="px-3 sm:px-6 pb-4"><div class="border border-slate-300 rounded-lg ${stim?'md:grid md:grid-cols-2':''}">
${stim?`<div class="p-4 sm:p-6 ${fzC()} border-b border-dotted border-slate-300 md:border-b-0 md:border-r">${fmt(stim)}</div>`:''}
<div class="p-4 sm:p-6 ${fzC()}"><div class="mb-4 leading-relaxed">${fmt(qq)}</div>${qInput(q,a.ans[q.id])}</div></div></div>
<div class="px-3 sm:px-6 py-4 grid grid-cols-3 gap-2 sm:gap-6 border-t border-slate-200">
<button onclick="go(-1)" ${ix===0?'disabled':''} class="${bt} bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 disabled:opacity-40">&lsaquo; Sebelumnya</button>
<button onclick="flag()" class="${bt} bg-amber-400 hover:bg-amber-500 text-slate-900"><span class="inline-block w-4 h-4 rounded-sm bg-white border border-slate-500 mr-1.5 text-[11px] leading-[14px] align-[-3px]">${a.flags[q.id]?'&#10003;':''}</span>Ragu-ragu</button>
<button onclick="${last?'askSubmit()':'go(1)'}" class="${bt} bg-teal-700 hover:bg-teal-800 text-white">${last?'Selesai &#10003;':'Berikutnya &rsaquo;'}</button></div>
</div></main>
${need?`<div class="fixed inset-0 z-40 bg-slate-900 flex items-center justify-center p-6 text-center text-white"><div><p class="mb-4">Ujian harus dikerjakan dalam layar penuh.</p><button class="${P}" onclick="document.documentElement.requestFullscreen().catch(()=>{})">Masuk layar penuh</button></div></div>`:''}</div>`}
function saveSoon(){clearTimeout(sv);sv=setTimeout(()=>rpc('save_progress',{t:S.token,a:att().ans,f:att().flags}).catch(()=>{}),400)}
const cur=()=>att().qs[ix];
function setAns(v){const q=cur();if(answered(v))att().ans[q.id]=v;else delete att().ans[q.id];saveSoon()}
const pick=j=>{setAns(j);render()};
const tog=j=>{const a=[...(att().ans[cur().id]||[])],p=a.indexOf(j);p<0?a.push(j):a.splice(p,1);setAns(a.sort((x,y)=>x-y));render()};
const fill=(q,n)=>Array.from({length:n},(_,i)=>(att().ans[q.id]||[])[i]??null);
const setBs=(j,b)=>{const q=cur(),a=fill(q,q.opts.length);a[j]=b;setAns(a);render()};
const setJ=(i,v)=>{const q=cur(),a=fill(q,q.opts.l.length);a[i]=v===''?null:+v;setAns(a);render()};
const setTxt=v=>setAns(v.trim()===''?'':v);
const go=d=>{ix=Math.max(0,Math.min(att().qs.length-1,ix+d));render()};
const flag=()=>{const id=att().qs[ix].id;att().flags[id]=!att().flags[id];saveSoon();render()};
function askSubmit(){const un=att().qs.filter(x=>att().ans[x.id]===undefined).length;ask(`Kumpulkan jawaban sekarang?${un?` <b>${un} soal belum dijawab.</b>`:''} Setelah dikumpulkan, jawaban tidak bisa diubah.`,submit,'Kumpulkan')}
async function submit(){if(sending)return;sending=true;try{await rpc('submit',{t:S.token,a:att().ans,f:att().flags});await load();closeM();if(document.fullscreenElement)document.exitFullscreen();ix=0;render()}catch(e){toast(e.message)}sending=false}
function resV(a){let h=`<div class="max-w-2xl mx-auto p-4"><div class="bg-white rounded-xl border p-6 text-center"><h2 class="font-bold text-lg mb-1">Ujian selesai</h2>`;
h+=CF.showResult?`<div class="text-6xl font-bold text-teal-700 my-3">${a.score}</div><p class="text-sm text-slate-600">Benar ${a.correct} dari ${a.total} soal</p>`:'<p class="my-3 text-slate-600">Jawaban Anda sudah tersimpan. Nilai akan diumumkan oleh guru.</p>';
if(a.reason!=='Dikumpulkan siswa')h+=`<p class="text-sm text-amber-700 mt-2">Status: ${esc(a.reason)}</p>`;h+='</div>';
if(CF.showResult&&CF.showExp)h+=a.qs.map((q,i)=>{const m=a.ans[q.id],ok=isOk(q,m);return`<div class="bg-white rounded-xl border p-4 mt-3"><div class="mb-2"><b>${i+1}.</b> ${qTxt(q.text)}</div><div class="mb-2">${itemsHtml(q)}</div><div class="text-sm">Jawaban Anda: <b class="${ok?'text-emerald-700':'text-red-600'}">${ansHtml(q,m)}</b></div>${ok?'':`<div class="text-sm">Kunci: <b class="text-emerald-700">${keyHtml(q)}</b></div>`}${q.exp?`<div class="text-sm mt-2 text-slate-600">Pembahasan: ${fmt(q.exp)}</div>`:''}</div>`}).join('');
return h+'</div>'}

/* ---------- ANTI-KECURANGAN (dicatat & dihitung oleh server) ---------- */
async function warn(why){if(!live())return;const n=Date.now();if(n-lw<1500)return;lw=n;let r;
  try{r=await rpc('violation',{t:S.token,why})}catch(e){att().warns++;r={warns:att().warns,done:att().warns>=CF.maxWarn}}
  if(r.done){await load().catch(()=>{});closeM();if(document.fullscreenElement)document.exitFullscreen();render();return}
  att().warns=r.warns;render();
  modal(`<h3 class="font-bold text-red-600 mb-2">Peringatan pelanggaran</h3><p class="mb-2">${esc(why)}.</p><p class="mb-4 text-sm">Pelanggaran ${r.warns} dari ${CF.maxWarn}. Pada pelanggaran ke-${CF.maxWarn}, ujian otomatis dikumpulkan.</p><button class="${P}" onclick="closeM();FS()&&!document.fullscreenElement&&document.documentElement.requestFullscreen().catch(()=>{})">Saya mengerti, lanjutkan</button>`)}
document.addEventListener('visibilitychange',()=>document.hidden&&warn('Anda berpindah tab/aplikasi atau mengunci layar'));
window.addEventListener('blur',()=>warn('Jendela ujian kehilangan fokus'));
document.addEventListener('fullscreenchange',()=>{if(live()&&FS()){if(!document.fullscreenElement)warn('Anda keluar dari mode layar penuh');else render()}});
['contextmenu','copy','cut','paste','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(live()&&!(t==='selectstart'&&e.target.tagName==='INPUT'))e.preventDefault()}));
document.addEventListener('keydown',e=>{if(!live())return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
if(e.key==='F12'||e.key==='PrintScreen'||(m&&['c','v','x','a','u','s','p'].includes(k))||(m&&e.shiftKey&&['i','j','c'].includes(k)))e.preventDefault()});
window.addEventListener('beforeunload',e=>{if(live()){e.preventDefault();e.returnValue=''}});
setInterval(()=>{if(!live())return;const s=rem(),el=$('#tm');
 if(el){el.textContent=tmTxt(s);el.className='font-mono font-bold '+(s<60?'text-red-600':'text-teal-800')}
 if(s<=0)submit()},1000);
setInterval(()=>{if(S&&S.role==='admin'&&tab==='rekap'&&!$('#modal').innerHTML&&document.activeElement?.tagName!=='SELECT')refresh()},5000);
(async()=>{if(SUPABASE_URL.startsWith('GANTI')){$('#app').innerHTML='<div class="p-6 max-w-md mx-auto">Isi <b>SUPABASE_URL</b> dan <b>SUPABASE_KEY</b> di bagian atas file ini terlebih dahulu.</div>';return}
 try{CF=await rpc('get_cfg')}catch(e){}
 try{await load()}catch(e){$('#app').innerHTML='<div class="p-6 max-w-md mx-auto text-red-600">Tidak dapat terhubung ke server. Periksa koneksi internet.</div>';return}
 render();if(live()&&rem()<=0)submit()})();
</script></body></html>
