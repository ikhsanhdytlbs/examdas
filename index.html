<script>
/* ====== ISI DUA BARIS INI (Supabase > Project Settings > API) ====== */
const SUPABASE_URL='https://ucebilmfuracnvneuwfn.supabase.co';
const SUPABASE_KEY='sb_publishable_47H9vxFDBweX5mXXjMTL3Q_kHLcQT6W';

const APP='EXAMDAS';

const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));

P='px-4 py-2 rounded-lg bg-brand-600 text-white text-sm font-medium hover:bg-brand-700',

G='px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-sm hover:bg-slate-50';
async function rpc(fn,a={}){
  const h={apikey:SUPABASE_KEY,'Content-Type':'application/json'};if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(a)});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||'Gagal terhubung ke server');return j}
let S=LS('cbt_sess'),CF={title:'',duration:60,maxWarn:3},ST=null,AD=null,tab='rekap',sp=null,lr='siswa',ix=0,off=0,sending=false,lw=0,sv;
const att=()=>ST&&ST.att, live=()=>S&&S.role==='siswa'&&att()&&!att().done;
const FS=()=>CF.fs&&!!document.documentElement.requestFullscreen; // iPhone Safari tidak mendukung: otomatis dilewati
const toLocal=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
async function load(){if(!S)return;try{
  if(S.role==='admin'){AD=await rpc('admin_data',{t:S.token});CF=AD.cfg;off=AD.now-Date.now();if(!AD.pkgs.some(p=>p.id===sp))sp=CF.pkg}
  else{ST=await rpc('student_state',{t:S.token});CF=ST.cfg;off=ST.now-Date.now()}
}catch(e){if(/unauthorized/.test(e.message)){S=null;LS('cbt_sess',null);ST=AD=null}else throw e}}
async function refresh(){try{await load()}catch(e){toast(e.message)}render()}

function math(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],ignoredClasses:['no-math'],throwOnError:false})}

const closeM=()=>$('#modal').innerHTML='';
function ask(msg,cb,ok='Ya'){window._cb=cb;modal(`<p class="mb-4">${msg}</p><div class="flex justify-end gap-2"><button class="${G}" onclick="closeM()">Batal</button><button class="${P}" onclick="closeM();_cb()">${ok}</button></div>`)}
const act=async(fn,a)=>{try{await rpc(fn,{t:S.token,...a});await load();render()}catch(e){toast(e.message)}};

function render(){const a=$('#app');document.body.classList.toggle('login',!S);a.innerHTML=!S?loginV():S.role==='admin'?(AD?adminV():'<p class="p-6">Memuat...</p>'):(ST?studentV():'<p class="p-6">Memuat...</p>');
  document.body.classList.toggle('noselect',!!live());math(a)}
function loginV(){return`<div class="min-h-screen flex items-center justify-center p-4">

<div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-sm p-7">
<div class="w-14 h-14 rounded-full bg-brand-600 text-white flex items-center justify-center mx-auto mb-3"><svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/></svg></div>
<p class="text-center text-sm text-slate-500">Selamat datang di</p>
<h1 class="text-3xl font-bold text-center text-brand-600 leading-tight tracking-wide">${APP}</h1>
<p class="text-center text-xs text-slate-400 mb-5">${esc(CF.title||'Computer-Based Test')}</p>
<div class="flex bg-brand-50 rounded-full p-1 mb-4">${['siswa','admin'].map(r=>`<button onclick="lr='${r}';render()" class="flex-1 py-1.5 rounded-full text-sm font-medium ${lr===r?'bg-brand-600 text-white shadow':'text-slate-500'}">Masuk ${r==='admin'?'Guru':'Siswa'}</button>`).join('')}</div>
<input id="lu" placeholder="Username" class="${I}" autocapitalize="none" autocomplete="username"><div class="relative mt-3"><input id="lp" type="password" placeholder="Password" class="${I} pr-11" autocomplete="current-password" onkeydown="event.key==='Enter'&&login()"><button type="button" onclick="togglePw()" aria-label="Tampilkan atau sembunyikan password" class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-brand-600"><svg id="pe" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg id="pn" viewBox="0 0 24 24" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5-5.9M9.9 4.2A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.2 4.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg></button></div>
<p id="le" class="text-red-600 text-sm mt-2 min-h-5"></p><button onclick="login()" class="${Gr} w-full mt-2 !rounded-full !py-2.5">Masuk</button></div></div>`}
function togglePw(){const i=$('#lp'),show=i.type==='password';i.type=show?'text':'password';$('#pe').classList.toggle('hidden',show);$('#pn').classList.toggle('hidden',!show)}
async function login(){try{const r=await rpc('login',{u:$('#lu').value.trim(),p:$('#lp').value});
  if((lr==='admin')!==(r.role==='admin'))throw new Error('Akun ini bukan akun '+(lr==='admin'?'guru':'siswa')+'.');
  S={token:r.token,role:r.role,name:r.name,u:r.u};LS('cbt_sess',S);ix=0;await load();render()}
 catch(e){$('#le').textContent=e.message==='invalid'?'Username atau password salah.':e.message}}
function logout(){if(live())return;S=null;ST=AD=null;LS('cbt_sess',null);render()}
const hdr=()=>`<header class="bg-gradient-to-r from-brand-700 to-brand-400 text-white"><div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0">${LOGO}<div class="min-w-0"><div class="font-bold leading-tight truncate tracking-wide">${APP}</div><div class="text-xs text-brand-100 truncate">${esc(CF.title||'Computer-Based Test')}</div></div></div><div class="flex items-center gap-3 text-sm min-w-0"><span class="hidden sm:inline truncate max-w-48">${S.role==='admin'?'Guru':esc(S.name)}</span><button class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25" onclick="logout()">Keluar</button></div></div></header>`;

/* ---------- JENIS SOAL ---------- */
const L='ABCDEFGH',TY={pg:'Pilihan ganda',pgk:'Pilihan ganda kompleks',bs:'Benar / Salah',isian:'Isian singkat',jodoh:'Menjodohkan'};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nrm=s=>String(s??'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.');
const answered=a=>a!=null&&(Array.isArray(a)?a.some(x=>x!=null):a!=='');
const bsT=v=>v==null?'-':v?'B':'S';
function isOk(q,a){const k=q.key;if(!answered(a))return false;
 if(q.type==='pg')return a===k;
 if(q.type==='pgk')return Array.isArray(a)&&a.length===k.length&&k.every(x=>a.includes(x));
 if(q.type==='isian')return k.some(x=>nrm(x)===nrm(a));
 return Array.isArray(a)&&k.every((x,i)=>a[i]===x)}
function keyHtml(q){const k=q.key,o=q.opts;
 if(q.type==='pg')return`${L[k]}. ${fmt(o[k])}`;
 if(q.type==='pgk')return k.map(j=>L[j]).join(', ');
 if(q.type==='bs')return k.map((v,j)=>`${j+1}:${bsT(v)}`).join(' · ');
 if(q.type==='isian')return k.map(fmt).join(' | ');
 return k.map((v,i)=>`${i+1}→${L[v]}`).join(' · ')}
function ansHtml(q,a){if(!answered(a))return'(kosong)';
 if(q.type==='pg')return`${L[a]}. ${fmt(q.opts[a])}`;
 if(q.type==='pgk')return a.map(j=>L[j]).join(', ');
 if(q.type==='bs')return a.map((v,j)=>`${j+1}:${bsT(v)}`).join(' · ');
 if(q.type==='isian')return fmt(a);
 return a.map((v,i)=>`${i+1}→${v==null?'-':L[v]}`).join(' · ')}
function itemsHtml(q){
 if(q.type==='pg'||q.type==='pgk')return q.opts.map((o,j)=>`<div class="text-sm">${L[j]}. ${fmt(o)}</div>`).join('');
 if(q.type==='bs')return q.opts.map((o,j)=>`<div class="text-sm">${j+1}. ${fmt(o)}</div>`).join('');
 if(q.type==='jodoh')return`<div class="grid grid-cols-2 gap-2 text-sm"><div>${q.opts.l.map((o,i)=>`<div>${i+1}. ${fmt(o)}</div>`).join('')}</div><div>${q.opts.r.map((o,j)=>`<div>${L[j]}. ${fmt(o)}</div>`).join('')}</div></div>`;
 return''}
function qBody(q){const k=q.key,o=q.opts;
 if(q.type==='pg'||q.type==='pgk')return o.map((x,j)=>`<div class="${(q.type==='pg'?j===k:k.includes(j))?'text-emerald-700 font-semibold':''}">${L[j]}. ${fmt(x)}</div>`).join('');
 if(q.type==='bs')return o.map((x,j)=>`<div>${j+1}. ${fmt(x)} <b class="${k[j]?'text-emerald-700':'text-red-600'}">[${k[j]?'Benar':'Salah'}]</b></div>`).join('');
 if(q.type==='isian')return`<div class="text-emerald-700 font-semibold">Jawaban: ${k.map(fmt).join(' | ')}</div>`;
 return o.l.map((x,i)=>`<div>${i+1}. ${fmt(x)} <span class="text-emerald-700 font-semibold">&rarr; ${fmt(o.r[k[i]])}</span></div>`).join('')+(o.r.length>o.l.length?'<div class="text-slate-400">+ pilihan pengecoh</div>':'')}
function qInput(q,a){const t=q.type;
 if(t==='pg')return q.opts.map((o,j)=>{const on=a===j;return`<button onclick="pick(${j})" class="w-full text-left rounded-lg border px-4 py-3 mb-2 flex items-start gap-3 transition ${on?'border-brand-600 bg-brand-50 ring-1 ring-brand-600':'border-slate-300 hover:bg-slate-50'}"><span class="mt-0.5 w-5 h-5 shrink-0 rounded-full border-2 flex items-center justify-center ${on?'border-brand-600':'border-slate-400'}">${on?'<span class="w-2.5 h-2.5 rounded-full bg-brand-600"></span>':''}</span><span><b class="mr-1">${L[j]}.</b>${fmt(o)}</span></button>`}).join('');
 if(t==='pgk')return`<p class="text-xs text-slate-500 mb-2">Pilih semua jawaban yang benar.</p>`+q.opts.map((o,j)=>{const on=(a||[]).includes(j);return`<button onclick="tog(${j})" class="w-full text-left rounded-lg border px-4 py-3 mb-2 flex items-start gap-3 transition ${on?'border-brand-600 bg-brand-50 ring-1 ring-brand-600':'border-slate-300 hover:bg-slate-50'}"><span class="mt-0.5 w-5 h-5 shrink-0 rounded border-2 flex items-center justify-center text-white text-xs ${on?'border-brand-600 bg-brand-600':'border-slate-400'}">${on?'&#10003;':''}</span><span><b class="mr-1">${L[j]}.</b>${fmt(o)}</span></button>`}).join('');
 if(t==='bs')return`<p class="text-xs text-slate-500 mb-2">Tentukan setiap pernyataan Benar atau Salah.</p>`+q.opts.map((o,j)=>{const v=(a||[])[j];return`<div class="border rounded-lg p-3 mb-2"><div class="mb-2">${fmt(o)}</div><div class="flex gap-2">${[[true,'Benar'],[false,'Salah']].map(([b,l])=>`<button onclick="setBs(${j},${b})" class="${G} flex-1 ${v===b?'!bg-brand-600 !text-white':''}">${l}</button>`).join('')}</div></div>`}).join('');
 if(t==='isian')return`<input id="ti" class="${I} text-base" value="${esc(a||'')}" placeholder="Ketik jawaban Anda" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" oninput="setTxt(this.value)" onchange="render()">`;
 return`<p class="text-xs text-slate-500 mb-2">Pasangkan setiap pernyataan di kiri dengan pilihan yang tepat di kanan.</p><div class="border rounded-lg p-3 mb-3 bg-slate-50 text-sm">${q.opts.r.map((x,j)=>`<div><b>${L[j]}.</b> ${fmt(x)}</div>`).join('')}</div>`+q.opts.l.map((x,i)=>`<div class="border rounded-lg p-3 mb-2 flex items-center justify-between gap-3"><div>${i+1}. ${fmt(x)}</div><select class="border border-slate-300 rounded-lg px-2 py-1 text-base bg-white" onchange="setJ(${i},this.value)"><option value="">-</option>${q.opts.r.map((_,j)=>`<option value="${j}" ${(a||[])[i]===j?'selected':''}>${L[j]}</option>`).join('')}</select></div>`).join('')}

/* ---------- TAMPILAN UJIAN ---------- */
const LOGO='<div class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center shrink-0"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/></svg></div>';

const setFz=i=>{fz=i;try{localStorage.setItem('cbt_fz',i)}catch(e){}render()};

function qInfo(){const a=att(),q=cur(),n=a.qs.length,dn=a.qs.filter(x=>answered(a.ans[x.id])).length,fl=a.qs.filter(x=>a.flags[x.id]).length,r=(k,v)=>`<div class="flex justify-between gap-3 border-b border-slate-100 py-1.5"><span class="text-slate-500">${k}</span><b class="text-right">${v}</b></div>`;
modal(`<h3 class="font-semibold mb-3">Informasi soal</h3><div class="text-sm">${ST.pkg.subject?r('Mata pelajaran',esc(ST.pkg.subject)):''}${r('Judul ujian',esc(ST.pkg.name))}${r('Nomor soal',`${ix+1} dari ${n}`)}${r('Jenis soal',TY[q.type]||'')}${r('Status soal ini',a.flags[q.id]?'Ragu-ragu':answered(a.ans[q.id])?'Sudah dijawab':'Belum dijawab')}${r('Soal terjawab',`${dn} dari ${n}`)}${r('Soal ragu-ragu',fl)}${r('Pelanggaran',`${a.warns} dari ${CF.maxWarn}`)}</div><div class="text-right mt-4"><button class="${G}" onclick="closeM()">Tutup</button></div>`)}

function parseQ(txt){const raw=[];let q=null,f=null;
for(const rw of txt.replace(/\r/g,'').split('\n')){const l=rw.trim();if(!l)continue;let m;
 if((m=l.match(/^(\d+)\s*[.)]\s+(.*)$/))&&(!q||+m[1]===q.n+1||q.k!==null)){q={n:+m[1],text:m[2],o:{},k:null,exp:'',ty:'',pc:''};raw.push(q);f='text';continue}
 if(!q)continue;
 if(m=l.match(/^tipe\s*[:=]\s*(.*)$/i)){q.ty=m[1].trim().toLowerCase();f=null;continue}
 if(m=l.match(/^(?:kunci(?:\s+jawaban)?|jawaban)\s*[:=]\s*(.*)$/i)){q.k=m[1].trim();f='k';continue}
 if(m=l.match(/^(?:pembahasan|penjelasan)\s*[:=]\s*(.*)$/i)){q.exp=m[1];f='exp';continue}
 if(m=l.match(/^pengecoh\s*[:=]\s*(.*)$/i)){q.pc=m[1];f=null;continue}
 if((m=l.match(/^\(?([A-Ha-h])[.)]\s*(.*)$/))&&!(m[1].toUpperCase() in q.o)){q.o[m[1].toUpperCase()]=m[2];f=m[1].toUpperCase();continue}
 if(f==='text')q.text+='\n'+l;else if(f==='exp')q.exp+='\n'+l;else if(f==='k')q.k+=' '+l;else if(f)q.o[f]+='\n'+l}

return raw.map(q=>{const ks=Object.keys(q.o).sort(),oa=ks.map(k=>q.o[k].trim()),n=oa.length,ok=ks.every((k,i)=>k===L[i]),kl=(q.k||'').split(/[\s,;]+/).filter(Boolean);

const TPL=String.raw`PANDUAN FORMAT IMPOR SOAL - EXAMDAS
(Semua baris sebelum soal nomor 1 diabaikan, jadi panduan ini boleh dibiarkan.)

ATURAN UMUM
- Setiap soal diawali nomor urut lalu titik, mis. "1. " lalu "2. " dan seterusnya.
- Pilihan ditulis A. B. C. dst. (huruf besar lalu titik), minimal 2 pilihan.
- Kunci ditulis pada baris "Kunci: ..." (boleh juga "Jawaban: ...").
- Pembahasan ditulis pada baris "Pembahasan: ..." (boleh dikosongkan).
- Teks soal, pilihan, dan pembahasan boleh lebih dari satu baris.
- Rumus ditulis dengan LaTeX di antara tanda dolar: $x^2$ (sebaris) atau $$\frac{a}{b}$$ (blok).
- Soal bersumber teks atau data: tulis teks sumber, lalu satu baris berisi ###, lalu pertanyaannya.
- Jenis soal ditulis pada baris "Tipe:" dengan pilihan: pg, pgk, bs, isian, jodoh.
  Tanpa baris Tipe, soal dianggap pilihan ganda (atau pgk jika kuncinya lebih dari satu huruf).
- Beri satu baris kosong antar soal agar rapi (tidak wajib).

CONTOH SEMUA JENIS SOAL (hapus atau ganti dengan soal Anda)

1. Ibu kota Indonesia adalah ...
A. Surabaya
B. Jakarta
C. Bandung
D. Medan
E. Makassar
Kunci: B
Pembahasan: Jakarta adalah ibu kota negara Indonesia.

2. Pilihlah semua pernyataan yang benar tentang bilangan prima.
Tipe: pgk
A. 2 adalah bilangan prima
B. 9 adalah bilangan prima
C. 7 adalah bilangan prima
D. 1 adalah bilangan prima
Kunci: A,C
Pembahasan: 9 habis dibagi 3 dan 1 bukan bilangan prima.

3. Tentukan Benar (B) atau Salah (S) untuk setiap pernyataan berikut.
Tipe: bs
A. Air murni mendidih pada suhu 100 derajat Celsius pada tekanan 1 atm.
B. Bumi adalah planet terbesar di tata surya.
C. Matahari terbit di arah timur.
Kunci: B,S,B
Pembahasan: Planet terbesar di tata surya adalah Jupiter.

4. Hasil dari $2 + 3 \times 4$ adalah ...
Tipe: isian
Kunci: 14
Pembahasan: Perkalian dikerjakan lebih dulu, sehingga $2 + 12 = 14$.

5. Jodohkan setiap negara dengan ibu kotanya.
Tipe: jodoh
A. Jepang => Tokyo
B. Prancis => Paris
C. Mesir => Kairo
Pengecoh: Roma | Madrid
Pembahasan: Pengecoh adalah pilihan kanan yang tidak punya pasangan.

6. Perhatikan data berikut.
Sebuah mobil menempuh jarak $120$ km dalam waktu $2$ jam.
###
Kecepatan rata-rata mobil tersebut adalah ...
A. 40 km/jam
B. 50 km/jam
C. 60 km/jam
D. 70 km/jam
E. 80 km/jam
Kunci: C
Pembahasan: $v=\frac{s}{t}=\frac{120}{2}=60$ km/jam.

CATATAN JENIS SOAL
- pgk (pilihan ganda kompleks): Kunci berisi lebih dari satu huruf, dipisah koma, mis. Kunci: A,C

- isian: tanpa pilihan A-E; Kunci berisi jawaban benar. Jawaban alternatif dipisah tanda |, mis. Kunci: 14 | empat belas
