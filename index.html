 if((m=l.match(/^(\d+)\s*[.)]\s+(.*)$/))&&(!q||+m[1]===q.n+1||q.k!==null)){q={n:+m[1],text:m[2],o:{},k:null,exp:'',ty:'',pc:'',w:1,tol:0,wc:''};raw.push(q);f='text';continue}

 if(m=l.match(/^tipe\s*[:=]\s*(.*)$/i)){q.ty=m[1].trim().toLowerCase();f=null;continue}
 if(m=l.match(/^(?:kunci(?:\s+jawaban)?|jawaban)\s*[:=]\s*(.*)$/i)){q.k=m[1].trim();f='k';continue}
 if(m=l.match(/^(?:pembahasan|penjelasan)\s*[:=]\s*(.*)$/i)){q.exp=m[1];f='exp';continue}
 if(m=l.match(/^bobot\s*[:=]\s*([\d.,]+)\s*$/i)){q.w=Math.min(100,Math.max(0.1,parseFloat(m[1].replace(',','.'))||1));f=null;continue}
 if(m=l.match(/^toleransi\s*[:=]\s*([\d.,]+)\s*$/i)){q.tol=parseFloat(m[1].replace(',','.'))||0;f=null;continue}
 if(m=l.match(/^pengecoh\s*[:=]\s*(.*)$/i)){q.pc=m[1];f=null;continue}
 if((m=l.match(/^\(?([A-Ha-h])[.)]\s*(.*)$/))&&!(m[1].toUpperCase() in q.o)){q.o[m[1].toUpperCase()]=m[2];f=m[1].toUpperCase();continue}
 if(f==='text')q.text+='\n'+l;else if(f==='wc')q.wc+='\n'+l;else if(f==='exp')q.exp+='\n'+l;else if(f==='k')q.k+=' '+l;else if(f)q.o[f]+='\n'+l}

 let t=q.ty?(AL[q.ty]||q.ty):(kl.length>1&&kl.every(x=>/^[A-Ha-h]$/.test(x))?'pgk':(n?'pg':'isian'));
 const fail=e=>({n:q.n,type:TY[t]?t:'pg',text:tx,opts:[],key:null,exp:'',err:e}),base={n:q.n,type:t,text:tx,exp:q.exp.trim(),w:q.w||1,err:''};

const TPL=String.raw`PANDUAN FORMAT IMPOR SOAL - EXAMDAS
(Semua baris sebelum soal nomor 1 diabaikan, jadi panduan ini boleh dibiarkan.)

ATURAN UMUM
- Setiap soal diawali nomor urut lalu titik, mis. "1. " lalu "2. " dan seterusnya.
- Pilihan ditulis A. B. C. dst. (huruf besar lalu titik), minimal 2 pilihan.
- Kunci ditulis pada baris "Kunci: ..." (boleh juga "Jawaban: ...").
- Pembahasan ditulis pada baris "Pembahasan: ..." (boleh dikosongkan).
- Wacana atau teks sumber ditulis pada baris "Wacana: ..." di dalam soal (boleh beberapa baris). Untuk soal berikutnya yang memakai wacana yang sama, cukup tulis "Wacana: sama".
- Teks soal, pilihan, dan pembahasan boleh lebih dari satu baris.
- Rumus ditulis dengan LaTeX di antara tanda dolar: $x^2$ (sebaris) atau $$\frac{a}{b}$$ (blok).
- Soal bersumber teks atau data: tulis teks sumber, lalu satu baris berisi ###, lalu pertanyaannya.
- Jenis soal ditulis pada baris "Tipe:" dengan pilihan: pg, pgk, bs, isian, jodoh, uraian.
  Tanpa baris Tipe, soal dianggap pilihan ganda (atau pgk jika kuncinya lebih dari satu huruf).
- Beri satu baris kosong antar soal agar rapi (tidak wajib).

CONTOH SEMUA JENIS SOAL (hapus atau ganti dengan soal Anda)

1. Ibu kota Indonesia adalah ...
A. Surabaya
B. Jakarta
C. Bandung
D. Medan
E. Makassar
Kunci: B
Pembahasan: Jakarta adalah ibu kota negara Indonesia.

2. Pilihlah semua pernyataan yang benar tentang bilangan prima.
Tipe: pgk
A. 2 adalah bilangan prima
B. 9 adalah bilangan prima
C. 7 adalah bilangan prima
D. 1 adalah bilangan prima
Kunci: A,C
Pembahasan: 9 habis dibagi 3 dan 1 bukan bilangan prima.

3. Tentukan Benar (B) atau Salah (S) untuk setiap pernyataan berikut.
Tipe: bs
A. Air murni mendidih pada suhu 100 derajat Celsius pada tekanan 1 atm.
B. Bumi adalah planet terbesar di tata surya.
C. Matahari terbit di arah timur.
Kunci: B,S,B
Pembahasan: Planet terbesar di tata surya adalah Jupiter.

4. Hasil dari $2 + 3 \times 4$ adalah ...
Tipe: isian
Kunci: 14
Pembahasan: Perkalian dikerjakan lebih dulu, sehingga $2 + 12 = 14$.

5. Jodohkan setiap negara dengan ibu kotanya.
Tipe: jodoh
A. Jepang => Tokyo
B. Prancis => Paris
C. Mesir => Kairo
Pengecoh: Roma | Madrid
Pembahasan: Pengecoh adalah pilihan kanan yang tidak punya pasangan.

6. Perhatikan data berikut.
Sebuah mobil menempuh jarak $120$ km dalam waktu $2$ jam.
###
Kecepatan rata-rata mobil tersebut adalah ...
A. 40 km/jam
B. 50 km/jam
C. 60 km/jam
D. 70 km/jam
E. 80 km/jam
Kunci: C
Pembahasan: $v=\frac{s}{t}=\frac{120}{2}=60$ km/jam.

CATATAN JENIS SOAL
- pgk (pilihan ganda kompleks): Kunci berisi lebih dari satu huruf, dipisah koma, mis. Kunci: A,C
- bs (benar/salah): tiap pilihan adalah satu pernyataan; Kunci berisi B atau S sesuai urutan, mis. Kunci: B,S,B
- isian: tanpa pilihan A, B, C dst; Kunci berisi jawaban benar. Jawaban alternatif dipisah tanda |, mis. Kunci: 14 | empat belas
- jodoh (menjodohkan): tulis tiap pasangan sebagai "A. kiri => kanan". Pengecoh (opsional) dipisah tanda |.
- uraian: dinilai manual oleh guru. Baris "Kunci:" (opsional) berisi pedoman penilaian, mis. Kunci: langkah 1 benar, hasil akhir 12.
- Bobot: baris "Bobot: 2" (opsional, untuk jenis apa pun) membuat soal bernilai dua kali soal berbobot 1. Tanpa baris Bobot, bobotnya 1.
- Toleransi: baris "Toleransi: 0.01" (opsional, hanya isian angka) menerima jawaban yang selisihnya tidak lebih dari nilai itu. Jawaban angka 1/2, 0,5, dan 0.50 otomatis dianggap sama.`;

<div class="space-y-2">${rows.map(r=>`<div class="rounded-lg border p-2.5 text-sm"><div class="flex items-start gap-2"><b>${r.i+1}.</b><div class="flex-1 min-w-0 break-words">${qTxt(r.q.text,1)}</div><span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-medium ${CH[r.st][1]}">${CH[r.st][0]}</span></div><div class="mt-1 text-xs text-slate-600"><div><span class="text-slate-500">Jawaban Anda:</span> ${ansHtml(r.q,r.a)}</div><div><span class="text-slate-500">Kunci:</span> <span class="text-emerald-700">${keyHtml(r.q)}</span></div></div></div>`).join('')}</div>
<div class="sticky -mx-5 -mb-5 mt-4 px-5 py-3 bg-white border-t border-slate-200 flex justify-end gap-2" style="z-index:15;bottom:-1.25rem"><button class="${G}" onclick="closeM()">Lanjut mengerjakan</button><button class="${P}" onclick="pvExit()">Selesai uji coba</button></div>`);math($('#modal'))}
async function submit(){if(PVM)return pvTry();if(sending)return;sending=true;try{const pid=ST.pkg.id;await rpc('submit',{t:S.token,a:att().ans,f:att().flags});dirty=false;try{localStorage.removeItem(bkK())}catch(e){}await load();closeM();if(document.fullscreenElement)document.exitFullscreen();ix=0;try{RES=normRes(await rpc('student_result',{t:S.token,pid}),pid);CF=mkCF()}catch(e2){}render()}catch(e){if(Date.now()-subErr>20000){subErr=Date.now();toast(e.message+(/internet/i.test(e.message)?' Jawaban Anda aman tersimpan di HP. Tekan Kumpulkan lagi setelah koneksi kembali; bila waktu habis, sistem mengirim jawaban secara otomatis.':''))}}sending=false}
/* Ringkasan hasil untuk siswa: patuh pada pengaturan guru (nilai dan pembahasan). Benar/salah per nomor hanya tampil bila pembahasan dibuka. */
function resStat(a,R){const P=R.pcfg,n=a.qs.length,key=!!(P.showResult&&P.showExp&&!a.pending&&a.qs.every(q=>q.key!==undefined));
 const st=a.qs.map(q=>{const m=a.ans[q.id];if(!answered(m))return'k';if(!key)return'a';const pt=a.manual?a.manual[q.id]:null;if(q.type==='uraian')return pt==null?'a':pt>=100?'b':'s';return(pt!=null?pt>=100:isOk(q,m))?'b':'s'});
 const c=k=>st.filter(x=>x===k).length,dj=n-c('k'),tile=(v,l,cl)=>`<div class="rounded-xl border ${cl} px-2 py-3 text-center"><div class="text-2xl font-bold leading-none">${v}</div><div class="text-xs mt-1">${l}</div></div>`;
 const CL={b:'bg-emerald-100 text-emerald-800 border-emerald-300',s:'bg-red-100 text-red-700 border-red-300',a:'bg-brand-100 text-brand-700 border-brand-100',k:'bg-slate-100 text-slate-500 border-slate-300'};
 const tiles=key?[tile(c('b'),'Benar','bg-emerald-50 border-emerald-200 text-emerald-700'),tile(c('s'),'Kurang tepat','bg-red-50 border-red-200 text-red-700'),tile(c('k'),'Tidak dijawab','bg-slate-50 border-slate-200 text-slate-600')]:[tile(dj,'Dijawab','bg-brand-50 border-brand-100 text-brand-700'),tile(c('k'),'Tidak dijawab','bg-slate-50 border-slate-200 text-slate-600')];
 const map=st.map((x,i)=>{const cls=`w-9 h-9 rounded-lg border text-sm font-semibold flex items-center justify-center ${CL[x]}`;return key?`<button type="button" class="${cls}" aria-label="Soal ${i+1}" onclick="document.getElementById('rq${i}').scrollIntoView({behavior:'smooth',block:'start'})">${i+1}</button>`:`<span class="${cls}">${i+1}</span>`}).join('');
 const lg=key?[['b','Benar'],['s','Kurang tepat'],['k','Tidak dijawab']]:[['a','Dijawab'],['k','Tidak dijawab']];
 return`<div class="bg-white rounded-xl border p-4 mt-3"><div class="grid ${key?'grid-cols-3':'grid-cols-2'} gap-2 mb-3">${tiles.join('')}</div><div class="text-xs font-medium text-slate-600 mb-1.5">Peta soal${key?' (ketuk nomor untuk melihat pembahasan)':''}</div><div class="flex flex-wrap gap-1.5">${map}</div><div class="flex flex-wrap gap-x-3 gap-y-1 mt-2 text-xs text-slate-500">${lg.map(([k,l])=>`<span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded border ${CL[k]}"></span>${l}</span>`).join('')}</div></div>`}
function resV(a,R){const P=R.pcfg,sR=P.showResult;let h=`<div data-vt class="max-w-2xl mx-auto p-4"><button class="${G} mb-2" onclick="backHome()">&lsaquo; Daftar ujian</button><div class="bg-white rounded-xl border p-6 text-center"><div class="text-xs text-slate-400">${esc(R.pkg.name)}</div><h2 class="text-lg font-semibold text-slate-800 mb-1">Ujian selesai</h2>`;
h+=a.pending>0?`<p class="my-3 text-slate-600">Jawaban Anda sudah tersimpan. Nilai akhir akan muncul setelah guru menilai soal uraian (${a.pending} soal).</p>`:sR?`<div class="text-6xl font-bold text-brand-600 my-3" data-count="${esc(a.score)}">${a.score}</div><p class="text-sm text-slate-600">Benar ${a.correct} dari ${a.total} soal</p>`:'<p class="my-3 text-slate-600">Jawaban Anda sudah tersimpan. Nilai akan diumumkan oleh guru.</p>';
if(a.reason!=='Dikumpulkan siswa')h+=`<p class="text-sm text-amber-700 mt-2">Status: ${esc(a.reason)}</p>`;h+='</div>'+resStat(a,R);
if(sR&&P.showExp&&!a.pending)h+=a.qs.map((q,i)=>{const m=a.ans[q.id],ur=q.type==='uraian',pt=a.manual?a.manual[q.id]:null,ok=!ur&&(pt!=null?pt>=100:isOk(q,m));
 return`<div id="rq${i}" class="bg-white rounded-xl border border-l-4 ${ur?'border-l-slate-300':ok?'border-l-emerald-500':'border-l-red-400'} p-4 mt-3 scroll-mt-4"><div class="mb-2"><b>${i+1}.</b> ${qTxt(q.text)}</div>${qImg(q)}<div class="mb-2">${itemsHtml(q)}</div><div class="text-sm">Jawaban Anda: <b class="${ur?'':ok?'text-emerald-700':'text-red-600'}">${ansHtml(q,m)}</b></div>${ur?`<div class="text-sm">Nilai: <b>${pt!=null?pt+'/100':'-'}</b></div>${q.key&&q.key.ref?`<div class="text-sm">Pedoman: ${fmt(q.key.ref)}</div>`:''}`:ok?'':`<div class="text-sm">Kunci: <b class="text-emerald-700">${keyHtml(q)}</b></div>`}${q.exp?`<div class="text-sm mt-2 text-slate-600">Pembahasan: ${fmt(q.exp)}</div>`:''}</div>`}).join('');
return h+'</div>'}

/* ---------- ANTI-KECURANGAN (dicatat & dihitung oleh server) ---------- */
async function warn(why){if(PVM||!live())return;const n=Date.now();if(n-lw<1500)return;lw=n;let r;
  try{r=await rpc('violation',{t:S.token,why})}catch(e){att().warns++;r={warns:att().warns,done:att().warns>=CF.maxWarn}}
  if(r.done){await load().catch(()=>{});closeM();if(document.fullscreenElement)document.exitFullscreen();render();return}
  att().warns=r.warns;render();
  modal(`<h3 class="font-semibold text-lg text-red-600 mb-2">Peringatan pelanggaran</h3><p class="mb-2">${esc(why)}.</p><p class="mb-4 text-sm">Pelanggaran ${r.warns} dari ${CF.maxWarn}. Pada pelanggaran ke-${CF.maxWarn}, ujian otomatis dikumpulkan.</p><button class="${P}" onclick="closeM();FS()&&!document.fullscreenElement&&document.documentElement.requestFullscreen().catch(()=>{})">Saya mengerti, lanjutkan</button>`)}
const graceMs=()=>{const g=CF.grace;return Math.max(0,(g===undefined||g===null||g===''?3:(+g||0)))*1000};
function away(why){if(PVM||!live()||Date.now()<pauseV||aw)return;aw={t0:Date.now(),why};aw.tm=setTimeout(()=>{if(aw){const w=aw;aw=null;warn(w.why+' (lebih dari '+Math.round(graceMs()/1000)+' detik)')}},graceMs())}
function back(){if(pauseV)setTimeout(()=>{pauseV=0},1500);if(!aw)return;clearTimeout(aw.tm);const w=aw;aw=null;const s=Date.now()-w.t0;if(s>=graceMs()&&Date.now()>=pauseV)warn(w.why+' (selama '+Math.max(1,Math.round(s/1000))+' detik)')}
document.addEventListener('visibilitychange',()=>document.hidden?away('Anda berpindah tab/aplikasi atau mengunci layar'):back());
window.addEventListener('blur',()=>away('Jendela ujian kehilangan fokus'));
window.addEventListener('focus',back);
document.addEventListener('fullscreenchange',()=>{if(live()&&FS()){if(!document.fullscreenElement){if(Date.now()>=pauseV)warn('Anda keluar dari mode layar penuh')}else render()}});
['contextmenu','copy','cut','paste','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(live()&&!(t==='selectstart'&&['INPUT','TEXTAREA'].includes(e.target.tagName)))e.preventDefault()}));
document.addEventListener('keydown',e=>{if(!live())return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
if(e.key==='F12'||e.key==='PrintScreen'||(m&&['c','v','x','a','u','s','p'].includes(k))||(m&&e.shiftKey&&['i','j','c'].includes(k)))e.preventDefault()});
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen'&&live()){try{navigator.clipboard.writeText('')}catch(_){}toast('Tangkapan layar tidak diizinkan saat ujian.')}});

setInterval(()=>{if(!live())return;const s=rem();
 document.querySelectorAll('.tmx').forEach(el=>{el.textContent=tmTxt(s);el.className='tmx font-mono font-bold '+(s<60?'text-red-600':'text-brand-700')})
 if(s<=0)submit()},1000);
setInterval(()=>{const e=xp&&ST&&ST.list?ST.list.find(x=>x.id===xp):null;if(S&&S.role==='siswa'&&e&&!att()&&e.open&&$('#app').querySelector('[data-nopen]')&&Date.now()+off>=new Date(e.open).getTime())render()},1000);
/* Ping siswa: tiap 25-35 detik (acak agar ratusan siswa tidak serempak), dilewati saat tab tersembunyi, dan langsung dijalankan begitu siswa kembali ke tab */
async function pingTick(){if(!S||S.role!=='siswa'||!ST||starting)return;
 try{const r=await rpc('student_ping',{t:S.token}),a=att();off=r.now-Date.now();
  if(a&&!a.done){if(!r.live){await load();closeM();render()}else{if(r.end!==a.end)a.end=r.end;if(r.warns>a.warns)a.warns=r.warns}}
  else if(r.live&&!starting){RES=null;await load();render()}
 }catch(e){}}
(function pingLoop(){setTimeout(async()=>{if(!document.hidden)await pingTick();pingLoop()},25000+Math.random()*10000)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pingTick()});

 try{const pid=sp,r=await rpc('admin_monitor',{t:S.token,pid}),h=pid+JSON.stringify(r.att);off=r.now-Date.now();

 catch(e){}finally{MONB=false}}
