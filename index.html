const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ',TY={pg:'Pilihan ganda',pgk:'Pilihan ganda kompleks',bs:'Benar / Salah',isian:'Isian singkat',jodoh:'Menjodohkan',uraian:'Uraian (dinilai guru)'};

 if(q.type==='pgk')return Array.isArray(a)&&a.length===k.length&&k.every(x=>a.includes(x));
 if(q.type==='isian'){if(k.some(x=>nrm(x)===nrm(a)))return true;const v=numv(a);if(v==null)return false;const tl=Math.max(+(q.opts&&q.opts.tol)||0,1e-9);return k.some(x=>{const n=numv(x);return n!=null&&Math.abs(n-v)<=tl})}
 return Array.isArray(a)&&k.every((x,i)=>a[i]===x)}
function keyHtml(q){const k=q.key,o=q.opts;if(q.type==='uraian')return k&&k.ref?fmt(k.ref):'(tanpa pedoman)';
 if(q.type==='pg')return`${dl(q,k)}. ${fmt(o[k])}`;
 if(q.type==='pgk')return byP(q,k).map(j=>`${dl(q,j)}. ${fmt(o[j])}`).join('; ');

function rngS(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}let a=h>>>0;return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const NOSHUF=/(semua|seluruh)\s+(jawaban|pilihan|pernyataan|opsi)|di\s+atas|keduanya|tidak\s+ada\s+(jawaban|yang)|\b[a-e]\s*(dan|&)\s*[a-e]\b/i;
let RAW=false;
function perm(q){const n=q.opts.length,ix=[...Array(n).keys()];if(RAW||!CF.shufopt||(q.type!=='pg'&&q.type!=='pgk')||q.opts.some(o=>NOSHUF.test(String(o))))return ix;const r=rngS(S.u+'|'+q.id+'|'+(ST.pkg.name||''));for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));const x=ix[i];ix[i]=ix[j];ix[j]=x}return ix}

const byP=(q,a)=>[...a].sort((x,y)=>perm(q).indexOf(x)-perm(q).indexOf(y));
function numv(s){let x=String(s??'').trim().replace(/,/g,'.');if(!x||x.length>30)return null;let m=x.match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m){const d=+m[3];if(!d)return null;const f=+m[2]/d;return m[1][0]==='-'?+m[1]-f:+m[1]+f}x=x.replace(/\s+/g,'');if(/^[+-]?(\d+\.?\d*|\.\d+)$/.test(x))return +x;m=x.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);if(m){const d=+m[2];return d?+m[1]/d:null}return null}

 else if(q.type==='isian'){if(o&&!Array.isArray(o)&&o.tol)s+='Toleransi: '+o.tol+'\n';s+='Kunci: '+k.map(flat).join(' | ')+'\n'}

function imgComp(f,M0,lim0){return new Promise((ok,no)=>{
 if(!/^image\//.test(f.type))return no(new Error('File harus berupa gambar (JPG atau PNG).'));
 const u=URL.createObjectURL(f),im=new Image();

function parseQ(txt){const raw=[];let q=null,f=null;
for(const rw of txt.replace(/\r/g,'').split('\n')){const l=rw.trim();if(!l)continue;let m;
 if((m=l.match(/^(\d+)\s*[.)]\s+(.*)$/))&&(!q||+m[1]===q.n+1||q.k!==null)){q={n:+m[1],text:m[2],o:{},k:null,exp:'',ty:'',pc:'',w:1,tol:0};raw.push(q);f='text';continue}
 if(!q)continue;
 if(m=l.match(/^tipe\s*[:=]\s*(.*)$/i)){q.ty=m[1].trim().toLowerCase();f=null;continue}
 if(m=l.match(/^(?:kunci(?:\s+jawaban)?|jawaban)\s*[:=]\s*(.*)$/i)){q.k=m[1].trim();f='k';continue}
 if(m=l.match(/^(?:pembahasan|penjelasan)\s*[:=]\s*(.*)$/i)){q.exp=m[1];f='exp';continue}
 if(m=l.match(/^bobot\s*[:=]\s*([\d.,]+)\s*$/i)){q.w=Math.min(100,Math.max(0.1,parseFloat(m[1].replace(',','.'))||1));f=null;continue}
 if(m=l.match(/^toleransi\s*[:=]\s*([\d.,]+)\s*$/i)){q.tol=parseFloat(m[1].replace(',','.'))||0;f=null;continue}
 if(m=l.match(/^pengecoh\s*[:=]\s*(.*)$/i)){q.pc=m[1];f=null;continue}
 if((m=l.match(/^\(?([A-Ha-h])[.)]\s*(.*)$/))&&!(m[1].toUpperCase() in q.o)){q.o[m[1].toUpperCase()]=m[2];f=m[1].toUpperCase();continue}
 if(f==='text')q.text+='\n'+l;else if(f==='exp')q.exp+='\n'+l;else if(f==='k')q.k+=' '+l;else if(f)q.o[f]+='\n'+l}
const AL={pg:'pg','pilihan ganda':'pg',pgk:'pgk',kompleks:'pgk',bs:'bs','benar-salah':'bs',benarsalah:'bs','benar/salah':'bs',isian:'isian',jodoh:'jodoh',menjodohkan:'jodoh',uraian:'uraian',esai:'uraian'};
return raw.map(q=>{const ks=Object.keys(q.o).sort(),oa=ks.map(k=>q.o[k].trim()),n=oa.length,ok=ks.every((k,i)=>k===L[i]),kl=(q.k||'').split(/[\s,;]+/).filter(Boolean);
 let t=q.ty?(AL[q.ty]||q.ty):(kl.length>1&&kl.every(x=>/^[A-Ha-h]$/.test(x))?'pgk':(n?'pg':'isian'));
 const fail=e=>({n:q.n,type:TY[t]?t:'pg',text:q.text.trim(),opts:[],key:null,exp:'',err:e}),base={n:q.n,type:t,text:q.text.trim(),exp:q.exp.trim(),w:q.w||1,err:''};
 if(!base.text)return fail('teks soal kosong');
 if(t==='pg'||t==='pgk'){if(n<2||!ok||oa.some(x=>!x))return fail('pilihan harus berurutan mulai dari A (minimal 2)');
  const ki=kl.map(x=>L.indexOf(x.toUpperCase()));if(!kl.length||ki.some(j=>j<0||j>=n))return fail('kunci jawaban tidak ditemukan atau tidak valid');
  if(t==='pg'&&ki.length!==1)return fail('pilihan ganda hanya boleh 1 kunci (untuk lebih dari satu, tambahkan baris "Tipe: pgk")');
  return{...base,opts:oa,key:t==='pg'?ki[0]:[...new Set(ki)].sort((a,b)=>a-b)}}
 if(t==='bs'){if(!n||!ok||oa.some(x=>!x))return fail('pernyataan harus ditulis A, B, C, ... berurutan');
  const bk=kl.map(x=>/^(b|benar|t|true)$/i.test(x)?true:/^(s|salah|f|false)$/i.test(x)?false:null);
  if(bk.length!==n||bk.includes(null))return fail('Kunci harus berisi '+n+' huruf B/S, mis. B,S,B');
  return{...base,opts:oa,key:bk}}
 if(t==='isian'){const key=(q.k||'').split('|').map(x=>x.trim()).filter(Boolean);if(!key.length)return fail('kunci jawaban isian tidak ditemukan');return{...base,opts:q.tol>0?{tol:q.tol}:[],key}}
 if(t==='uraian')return{...base,opts:[],key:{ref:(q.k||'').trim()}};
 if(t==='jodoh'){const Pr=oa.map(x=>x.split('=>').map(y=>y.trim()));if(n<2||!ok||Pr.some(p=>p.length!==2||!p[0]||!p[1]))return fail('format pasangan: "A. kiri => kanan" (minimal 2 pasangan)');
  const d=(q.pc||'').split('|').map(x=>x.trim()).filter(Boolean),it=shuf([...Pr.map((p,i)=>({t:p[1],i})),...d.map(x=>({t:x,i:-1}))]);
  return{...base,opts:{l:Pr.map(p=>p[0]),r:it.map(x=>x.t)},key:Pr.map((_,i)=>it.findIndex(x=>x.i===i))}}
 return fail('jenis soal "'+q.ty+'" tidak dikenal')})}

const TPL=String.raw`PANDUAN FORMAT IMPOR SOAL - EXAMDAS
(Semua baris sebelum soal nomor 1 diabaikan, jadi panduan ini boleh dibiarkan.)

ATURAN UMUM
- Setiap soal diawali nomor urut lalu titik, mis. "1. " lalu "2. " dan seterusnya.

- Jenis soal ditulis pada baris "Tipe:" dengan pilihan: pg, pgk, bs, isian, jodoh, uraian.
  Tanpa baris Tipe, soal dianggap pilihan ganda (atau pgk jika kuncinya lebih dari satu huruf).
- Beri satu baris kosong antar soal agar rapi (tidak wajib).

CONTOH SEMUA JENIS SOAL (hapus atau ganti dengan soal Anda)

1. Ibu kota Indonesia adalah ...
A. Surabaya
B. Jakarta
C. Bandung

E. Makassar

CATATAN JENIS SOAL
- pgk (pilihan ganda kompleks): Kunci berisi lebih dari satu huruf, dipisah koma, mis. Kunci: A,C
