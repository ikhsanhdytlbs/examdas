# Menjaga proyek Supabase gratis tidak dijeda karena tidak ada aktivitas.
# Cara pakai (satu kali):
#  1. Buat repositori GitHub (boleh privat), lalu simpan file ini sebagai
#     .github/workflows/keepalive.yml
#  2. Di repositori: Settings > Secrets and variables > Actions > New repository secret
#       SUPABASE_URL  = alamat proyek, mis. https://abcd1234.supabase.co
#       SUPABASE_KEY  = anon public key (sama dengan SUPABASE_KEY di index.html)
#  3. Buka tab Actions > "Supabase keepalive" > Run workflow untuk mencoba sekali.
name: Supabase keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'   # tiap 3 hari, pukul 03:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil get_cfg
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_cfg" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
